<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>푸시 — 온보딩 인터랙션</title>

  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js"
    integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L"
    crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
    integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm"
    crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
    integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y"
    crossorigin="anonymous"></script>

  <style>
    :root {
      --font-sans: 'Pretendard Variable', 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;

      --canvas: #ffffff;
      --accent: #307AF3;
      --accent-bg: rgba(48, 122, 243, 0.06);
      --accent-bd: rgba(48, 122, 243, 0.45);
      --tile: #f4f3f1;
      --tile-bd: rgba(17, 17, 17, 0.06);
      --white: #ffffff;
      --ink: #1a1a1a;
      --ink-mid: rgba(26, 26, 26, 0.5);
      --ink-soft: rgba(26, 26, 26, 0.34);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
    }

    body {
      font-family: var(--font-sans);
      background: var(--canvas);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px 20px;
    }

    body::before {
      content: '';
      position: fixed;
      width: 700px;
      height: 500px;
      border-radius: 50%;
      background: radial-gradient(ellipse at center, rgba(48, 122, 243, 0.05) 0%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    #root {
      width: 100%;
      display: grid;
      place-items: center;
      position: relative;
    }

    /* ━━━━ DEMO CARD ━━━━ */
    .demo {
      width: 100%;
      max-width: 600px;
      background: var(--white);
      border-radius: 28px;
      padding: 28px 24px 24px;
      position: relative;
      overflow: hidden;
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.05),
        0 14px 44px rgba(20, 20, 50, 0.13);
      cursor: pointer;
    }

    .demo.running,
    .demo.done {
      cursor: default;
    }

    /* ━━━━ TOP ROW ━━━━ */
    .top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      gap: 12px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      color: var(--ink);
      background: #f4f3f1;
      border: 1px solid var(--tile-bd);
      padding: 5px 12px;
      border-radius: 9999px;
      letter-spacing: -0.01em;
      white-space: nowrap;
    }

    .badge::before {
      content: '';
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--accent);
      flex-shrink: 0;
    }

    .auto-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      padding: 5px 12px;
      border-radius: 9999px;
      background: #f0f0f0;
      color: var(--ink-mid);
      white-space: nowrap;
      transition: background 0.3s ease, color 0.3s ease;
    }

    .auto-pill .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--ink-soft);
      transition: background 0.3s ease;
    }

    .auto-pill.on {
      background: var(--accent);
      color: white;
    }

    .auto-pill.on .dot {
      background: white;
      animation: liveBlink 1.1s ease-in-out infinite;
    }

    /* ━━━━ HEADLINE ━━━━ */
    .headline {
      font-size: 23px;
      font-weight: 700;
      color: var(--ink);
      line-height: 1.35;
      letter-spacing: -0.025em;
      margin-bottom: 20px;
    }

    /* ━━━━ CUSTOMER SIGNAL PANEL ━━━━ */
    .panel {
      background: var(--tile);
      border: 1.5px solid var(--tile-bd);
      border-radius: 16px;
      padding: 15px 15px 16px;
      transition: border-color 0.3s ease, background 0.3s ease;
    }

    .panel.idle {
      animation: idlePulse 2.6s ease-in-out infinite;
    }

    .cust {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 13px;
    }

    .avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: #e3e0db;
      display: grid;
      place-items: center;
      color: var(--ink-mid);
      flex-shrink: 0;
    }

    .cust-meta {
      display: flex;
      flex-direction: column;
      gap: 1px;
      line-height: 1.2;
    }

    .cust-id {
      font-size: 13px;
      font-weight: 700;
      color: var(--ink);
      letter-spacing: -0.01em;
    }

    .cust-sub {
      font-size: 11.5px;
      font-weight: 500;
      color: var(--ink-mid);
      letter-spacing: -0.01em;
    }

    .signals {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .signal {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 13px;
      font-weight: 500;
      color: var(--ink-soft);
      letter-spacing: -0.015em;
      transition: color 0.3s ease;
    }

    .signal.done {
      color: var(--ink);
    }

    .sig-ic {
      width: 17px;
      height: 17px;
      border-radius: 50%;
      border: 1.5px solid rgba(26, 26, 26, 0.18);
      display: grid;
      place-items: center;
      flex-shrink: 0;
      background: transparent;
      transition: background 0.25s ease, border-color 0.25s ease;
    }

    .signal.done .sig-ic {
      background: var(--ink);
      border-color: var(--ink);
    }

    .sig-done-anim {
      animation: popBadge 0.36s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }

    /* risk meter */
    .risk {
      margin-top: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .risk-label {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--ink-mid);
      white-space: nowrap;
      letter-spacing: -0.01em;
    }

    .risk-track {
      flex: 1;
      height: 6px;
      border-radius: 9999px;
      background: rgba(26, 26, 26, 0.08);
      overflow: hidden;
    }

    .risk-fill {
      height: 100%;
      width: 8%;
      border-radius: 9999px;
      background: linear-gradient(90deg, #9db8e8, var(--accent));
      transition: width 1.4s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .risk-fill.high {
      width: 88%;
    }

    .risk-val {
      font-size: 11.5px;
      font-weight: 700;
      color: var(--ink-mid);
      white-space: nowrap;
      transition: color 0.3s ease;
    }

    .risk-val.high {
      color: var(--accent);
    }

    /* ━━━━ TRIGGER BANNER ━━━━ */
    .trigger {
      margin-top: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--accent-bg);
      border: 1.5px solid var(--accent-bd);
      border-radius: 13px;
      padding: 11px 13px;
      animation: riseIn 0.42s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .bolt {
      width: 26px;
      height: 26px;
      border-radius: 8px;
      flex-shrink: 0;
      background: var(--accent);
      display: grid;
      place-items: center;
    }

    .trigger-txt {
      display: flex;
      flex-direction: column;
      gap: 2px;
      line-height: 1.25;
    }

    .trigger-rule {
      font-size: 11px;
      font-weight: 600;
      color: var(--accent);
      letter-spacing: -0.01em;
    }

    .trigger-main {
      font-size: 13px;
      font-weight: 700;
      color: var(--ink);
      letter-spacing: -0.015em;
    }

    /* ━━━━ PUSH NOTIFICATION ━━━━ */
    .push {
      margin-top: 14px;
      background: var(--white);
      border: 1.5px solid var(--tile-bd);
      border-radius: 16px;
      padding: 13px 14px;
      box-shadow: 0 10px 26px rgba(0, 0, 0, 0.10);
      animation: pushIn 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
      position: relative;
    }

    .push-head {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .push-app {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      flex-shrink: 0;
      background: var(--accent);
      display: grid;
      place-items: center;
      color: white;
      font-size: 11px;
      font-weight: 800;
    }

    .push-app-name {
      font-size: 11.5px;
      font-weight: 700;
      color: var(--ink);
      letter-spacing: -0.01em;
    }

    .push-time {
      font-size: 11px;
      font-weight: 500;
      color: var(--ink-soft);
      margin-left: auto;
      white-space: nowrap;
    }

    .push-title {
      font-size: 14.5px;
      font-weight: 700;
      color: var(--ink);
      letter-spacing: -0.02em;
      margin-bottom: 3px;
      line-height: 1.3;
    }

    .push-body {
      font-size: 12.5px;
      font-weight: 500;
      color: var(--ink-mid);
      letter-spacing: -0.01em;
      line-height: 1.45;
    }

    .push-body b {
      color: var(--accent);
      font-weight: 700;
    }

    .push-timer {
      margin-top: 10px;
      display: flex;
      align-items: center;
      gap: 7px;
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 600;
      color: var(--accent);
    }

    .push-timer .clock {
      display: inline-grid;
      place-items: center;
    }

    .push-sent {
      position: absolute;
      top: 11px;
      right: 12px;
      font-size: 10px;
      font-weight: 600;
      color: var(--ink-soft);
      font-family: var(--font-mono);
      letter-spacing: 0.02em;
    }

    /* converted overlay on push */
    .push-converted {
      margin-top: 11px;
      display: flex;
      align-items: center;
      gap: 7px;
      padding-top: 11px;
      border-top: 1px solid var(--tile-bd);
      animation: riseIn 0.4s ease both;
    }

    .pc-check {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--accent);
      display: grid;
      place-items: center;
      flex-shrink: 0;
      animation: popBadge 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }

    .pc-text {
      font-size: 12.5px;
      font-weight: 700;
      color: var(--ink);
      letter-spacing: -0.01em;
    }

    /* ━━━━ STATUS ━━━━ */
    .status {
      text-align: center;
      min-height: 44px;
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .hint {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      width: 100%;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: white;
      background: linear-gradient(110deg,
          color-mix(in srgb, var(--accent), black 10%) 0%,
          var(--accent) 50%,
          color-mix(in srgb, var(--accent), white 22%) 100%);
      border-radius: 14px;
      padding: 14px 18px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      box-shadow: 0 4px 18px color-mix(in srgb, var(--accent), transparent 44%);
    }

    .hint::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 60%;
      height: 100%;
      background: linear-gradient(105deg,
          transparent 0%, rgba(255, 255, 255, 0.52) 50%, transparent 100%);
      animation: shimmerSweep 2s ease-in-out infinite;
      pointer-events: none;
    }

    .s-line {
      font-size: 13.5px;
      font-weight: 500;
      color: var(--ink);
      animation: riseIn 0.38s ease both;
    }

    .s-stat {
      font-size: 14px;
      font-weight: 700;
      color: var(--accent);
      animation: riseIn 0.38s 0.08s ease both;
    }

    .s-stat b {
      font-size: 16px;
    }

    .replay-btn {
      margin-top: 4px;
      font-family: var(--font-sans);
      font-size: 12px;
      font-weight: 500;
      color: var(--ink-mid);
      background: none;
      border: 1px solid rgba(0, 0, 0, 0.12);
      border-radius: 9999px;
      padding: 6px 14px;
      cursor: pointer;
      animation: riseIn 0.38s 0.2s ease both;
      transition: color 0.18s ease, background 0.18s ease;
    }

    .replay-btn:hover {
      color: var(--ink);
      background: rgba(0, 0, 0, 0.04);
    }

    /* ━━━━ CONFETTI ━━━━ */
    .conf-wrap {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      border-radius: inherit;
    }

    .conf-piece {
      position: absolute;
      animation: confDrop linear forwards;
    }

    /* ━━━━ KEYFRAMES ━━━━ */
    @keyframes idlePulse {

      0%,
      100% {
        box-shadow: 0 0 0 0px rgba(48, 122, 243, 0);
      }

      50% {
        box-shadow: 0 0 0 5px rgba(48, 122, 243, 0.12);
      }
    }

    @keyframes liveBlink {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.35;
      }
    }

    @keyframes popBadge {
      0% {
        transform: scale(0) rotate(-12deg);
        opacity: 0;
      }

      65% {
        transform: scale(1.2) rotate(3deg);
        opacity: 1;
      }

      100% {
        transform: scale(1) rotate(0);
        opacity: 1;
      }
    }

    @keyframes riseIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pushIn {
      from {
        opacity: 0;
        transform: translateY(20px) scale(0.97);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes breathe {

      0%,
      100% {
        opacity: 0.4;
      }

      50% {
        opacity: 0.82;
      }
    }

    @keyframes shimmerSweep {
      0% {
        transform: translateX(-180%);
      }

      100% {
        transform: translateX(350%);
      }
    }

    100% {
      background-position: 200% center;
    }
    }

    35% {
      transform: scale(0.55);
      opacity: 0.65;
    }

    60% {
      transform: scale(1.38);
      opacity: 1;
    }
    }

    @keyframes confDrop {
      0% {
        transform: translateY(-10px) rotate(0deg);
        opacity: 1;
      }

      100% {
        transform: translateY(560px) rotate(520deg);
        opacity: 0;
      }
    }

    @keyframes pulseRing {
      0% {
        box-shadow: 0 0 0 0 rgba(48, 122, 243, 0.35);
      }

      100% {
        box-shadow: 0 0 0 9px rgba(48, 122, 243, 0);
      }
    }
  </style>

<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    /* ── Icons ── */
    const UserIcon = () => (
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <circle cx="12" cy="8" r="3.4" stroke="currentColor" strokeWidth="1.8" />
        <path d="M5 20a7 7 0 0 1 14 0" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" />
      </svg>
    );
    const CheckIcon = ({ s = 10 }) => (
      <svg width={s} height={s} viewBox="0 0 11 11" fill="none" aria-hidden="true">
        <path d="M2 5.5L4.5 8L9 3" stroke="white" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" />
      </svg>
    );
    const BoltIcon = () => (
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M13 2L4.5 13.5H11l-1 8.5L19.5 10H13l0-8z" fill="white" />
      </svg>
    );
    const ClockIcon = () => (
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <circle cx="12" cy="12" r="9" stroke="currentColor" strokeWidth="2" />
        <path d="M12 7v5l3.2 2" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />
      </svg>
    );

    /* ── Confetti ── */
    const CONF_COLORS = ['#307AF3', '#A9C4F2', '#D8B48A', '#A7C0A1', '#7FA8E8', '#222222'];
    const Confetti = () => {
      const pieces = useMemo(() =>
        Array.from({ length: 30 }, (_, i) => ({
          id: i, left: 2 + Math.random() * 96,
          color: CONF_COLORS[i % CONF_COLORS.length],
          delay: Math.random() * 0.6, dur: 1.1 + Math.random() * 1.0,
          w: 5 + Math.random() * 7, h: 5 + Math.random() * 7,
          round: Math.random() > 0.45,
        })), []
      );
      return (
        <div className="conf-wrap">
          {pieces.map(p => (
            <div key={p.id} className="conf-piece" style={{
              left: `${p.left}%`, top: -10, width: p.w, height: p.h,
              background: p.color, borderRadius: p.round ? '50%' : '2px',
              animationDelay: `${p.delay}s`, animationDuration: `${p.dur}s`,
            }} />
          ))}
        </div>
      );
    };

    /* ── Count-up hook ── */
    const useCountUp = (target, durationMs, active) => {
      const [val, setVal] = useState(0);
      useEffect(() => {
        if (!active) { setVal(0); return; }
        let raf; const t0 = performance.now();
        const tick = (ts) => {
          const p = Math.min((ts - t0) / durationMs, 1);
          setVal(Math.floor((1 - Math.pow(1 - p, 3)) * target));
          if (p < 1) raf = requestAnimationFrame(tick); else setVal(target);
        };
        raf = requestAnimationFrame(tick);
        // backstop: guarantee final value even if rAF is throttled (e.g. backgrounded tab)
        const done = setTimeout(() => setVal(target), durationMs + 120);
        return () => { cancelAnimationFrame(raf); clearTimeout(done); };
      }, [active]);
      return val;
    };

    /* ── Behavior signals ── */
    const SIGNALS = [
      '상품 상세 3회 재방문',
      '장바구니 담고 결제 직전 이탈',
      '5분째 결제 망설이는 중',
    ];

    const Signal = ({ text, done }) => (
      <div className={`signal ${done ? 'done' : ''}`}>
        <span className={`sig-ic ${done ? 'sig-done-anim' : ''}`}>
          {done && <CheckIcon s={9} />}
        </span>
        <span>{text}</span>
      </div>
    );

    /* ── Live countdown (mm:ss) ── */
    const Countdown = ({ running }) => {
      const [sec, setSec] = useState(300);
      useEffect(() => {
        if (!running) return;
        const t = setInterval(() => setSec(s => (s > 0 ? s - 1 : 0)), 1000);
        return () => clearInterval(t);
      }, [running]);
      const mm = String(Math.floor(sec / 60)).padStart(2, '0');
      const ss = String(sec % 60).padStart(2, '0');
      return (
        <div className="push-timer">
          <span className="clock"><ClockIcon /></span>
          <span>혜택 마감까지 {mm}:{ss}</span>
        </div>
      );
    };

    /* ── Main Demo ── */
    const Demo = () => {
      const [phase, setPhase] = useState(0);   // 0 idle · 1 detect · 2 trigger · 3 push · 4 converted
      const [sigDone, setSigDone] = useState(0);
      const ids = useRef([]);
      const conv = useCountUp(32, 800, phase === 4);

      const later = (fn, d) => ids.current.push(setTimeout(fn, d));
      const stop = () => { ids.current.forEach(clearTimeout); ids.current = []; };
      useEffect(() => stop, []);

      const start = () => {
        if (phase !== 0) return;
        setPhase(1);
        later(() => setSigDone(1), 350);
        later(() => setSigDone(2), 1050);
        later(() => setSigDone(3), 1750);
        later(() => setPhase(2), 2350);   // risk high → automation trigger
        later(() => setPhase(3), 3350);   // push auto-sent
        later(() => setPhase(4), 5400);   // converted
      };
      const reset = (e) => { e.stopPropagation(); stop(); setPhase(0); setSigDone(0); };

      const riskHigh = phase >= 2;

      return (
        <div
          className={`demo ${phase === 0 ? '' : phase === 4 ? 'done' : 'running'}`}
          data-screen-label={`phase-${phase}`}
          onClick={phase === 0 ? start : undefined}
        >
          {phase === 4 && <Confetti key="conf" />}

          {/* top row */}
          <div className="top-row">
            <div className="badge">알파푸시</div>
            <div className={`auto-pill ${phase >= 2 ? 'on' : ''}`}>
              <span className="dot"></span>
              <span>{phase >= 2 ? '자동화 작동 중' : '자동화 대기'}</span>
            </div>
          </div>

          {/* headline */}
          <h2 className="headline">
            망설이는 고객을<br />
            자동으로 붙잡는 순간
          </h2>

          {/* signal panel */}
          <div className={`panel ${phase === 0 ? 'idle' : ''}`}>
            <div className="cust">
              <div className="avatar"><UserIcon /></div>
              <div className="cust-meta">
                <span className="cust-id">고객 #1024</span>
                <span className="cust-sub">결제 직전 이탈 징후</span>
              </div>
            </div>

            <div className="signals">
              {SIGNALS.map((t, i) => (
                <Signal key={i} text={t} done={sigDone > i} />
              ))}
            </div>

            <div className="risk">
              <span className="risk-label">이탈 위험</span>
              <div className="risk-track">
                <div className={`risk-fill ${riskHigh ? 'high' : ''}`}></div>
              </div>
              <span className={`risk-val ${riskHigh ? 'high' : ''}`}>
                {riskHigh ? '매우 높음' : '감지 중'}
              </span>
            </div>
          </div>

          {/* trigger banner */}
          {phase >= 2 && (
            <div className="trigger">
              <span className="bolt"><BoltIcon /></span>
              <div className="trigger-txt">
                <span className="trigger-rule">이탈하려는 바로 그 순간</span>
                <span className="trigger-main">맞춤 푸시가 자동으로 나갔어요</span>
              </div>
            </div>
          )}

          {/* auto-sent push notification */}
          {phase >= 3 && (
            <div className="push" key="push">
              <div className="push-head">
                <span className="push-app">S</span>
                <span className="push-app-name">살라드샵</span>
                <span className="push-time">자동 발송 · 지금</span>
              </div>
              <p className="push-title">회원님, 지금 결제하면 더 쌉니다</p>
              <p className="push-body">
                장바구니에 담아둔 상품, <b>5분 안에 결제하면 10% 할인 + 무료배송</b>.
                지금 안 사면 정가로 돌아가요.
              </p>
              <Countdown running={phase === 3} />
              {phase >= 4 && (
                <div className="push-converted">
                  <span className="pc-check"><CheckIcon s={10} /></span>
                  <span className="pc-text">푸시 한 번에 결제 완료</span>
                </div>
              )}
            </div>
          )}

          {/* status */}
          <div className="status">
            {phase === 0 && <p className="hint">탭하면 자동화가 작동해요</p>}
            {phase === 1 && <p className="s-line">고객 행동 신호 감지 중…</p>}
            {phase === 2 && <p className="s-line">이탈 위험 감지 — 자동화 트리거됨</p>}
            {phase === 3 && <p className="s-line">맞춤 푸시 자동 발송됨</p>}
            {phase === 4 && (
              <>
                <p className="s-line">놓칠 뻔한 고객, 자동으로 전환</p>
                <p className="s-stat">구매 전환율 <b>+{conv}%</b></p>
                <button className="replay-btn" onClick={reset}>다시 보기</button>
              </>
            )}
          </div>
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
  </script>
</body>

</html>
