<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>푸시 — 온보딩 인터랙션</title>

  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js"
    integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L"
    crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
    integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm"
    crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
    integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y"
    crossorigin="anonymous"></script>

  <style>
    :root {
      --font-sans: 'Pretendard Variable', 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;

      --canvas: #ffffff;
      --accent: #307AF3;
      --accent-bg: rgba(48, 122, 243, 0.06);
      --accent-bd: rgba(48, 122, 243, 0.45);
      --tile: #f4f3f1;
      --tile-bd: rgba(17, 17, 17, 0.06);
      --white: #ffffff;
      --ink: #1a1a1a;
      --ink-mid: rgba(26, 26, 26, 0.5);
      --ink-soft: rgba(26, 26, 26, 0.34);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
    }

    body {
      font-family: var(--font-sans);
      background: var(--canvas);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px 20px;
    }

    body::before {
      content: '';
      position: fixed;
      width: 700px;
      height: 500px;
      border-radius: 50%;
      background: radial-gradient(ellipse at center, rgba(48, 122, 243, 0.05) 0%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    #root {
      width: 100%;
      display: grid;
      place-items: center;
      position: relative;
    }

    /* ━━━━ DEMO CARD ━━━━ */
    .demo {
      width: 100%;
      max-width: 600px;
      background: var(--white);
      border-radius: 28px;
      padding: 28px 24px 24px;
      position: relative;
      overflow: hidden;
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.05),
        0 14px 44px rgba(20, 20, 50, 0.13);
      cursor: default;
    }

    /* ━━━━ TOP ROW ━━━━ */
    .top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      gap: 12px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      color: var(--ink);
      background: #f4f3f1;
      border: 1px solid var(--tile-bd);
      padding: 5px 12px;
      border-radius: 9999px;
      letter-spacing: -0.01em;
      white-space: nowrap;
    }

    .badge::before {
      content: '';
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--accent);
      flex-shrink: 0;
    }

    .auto-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      padding: 5px 12px;
      border-radius: 9999px;
      background: #f0f0f0;
      color: var(--ink-mid);
      white-space: nowrap;
      transition: background 0.3s ease, color 0.3s ease;
    }

    .auto-pill .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--ink-soft);
      transition: background 0.3s ease;
    }

    .auto-pill.on {
      background: var(--accent);
      color: white;
    }

    .auto-pill.on .dot {
      background: white;
      animation: liveBlink 1.1s ease-in-out infinite;
    }

    /* ━━━━ HEADLINE ━━━━ */
    .headline {
      font-size: 23px;
      font-weight: 700;
      color: var(--ink);
      line-height: 1.35;
      letter-spacing: -0.025em;
      margin-bottom: 20px;
    }

    /* ━━━━ REVENUE BOARD ━━━━ */
    .board {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 16px;
      min-height: 0;
      border: 1.5px solid var(--tile-bd);
      border-radius: 16px;
      padding: 18px;
      background: #fbfbfa;
    }

    .rev {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .rev-label {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--ink-mid);
      letter-spacing: -0.01em;
    }

    .rev-numrow {
      display: flex;
      align-items: baseline;
      gap: 10px;
      flex-wrap: wrap;
    }

    .rev-num {
      font-size: 30px;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: var(--ink);
      font-variant-numeric: tabular-nums;
    }

    .rev-delta {
      font-size: 14px;
      font-weight: 800;
      color: #12b886;
      opacity: 0;
      transform: translateY(4px);
      transition: opacity .3s ease, transform .3s ease;
    }

    .rev-delta.show {
      opacity: 1;
      transform: none;
    }

    .chart {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: stretch;
      gap: 14px;
      padding-top: 4px;
    }

    .bar-col {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 9px;
    }

    .bar-wrap {
      flex: 1;
      min-height: 0;
      width: 100%;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    .bar {
      width: 100%;
      max-width: 60px;
      height: 0;
      border-radius: 10px 10px 0 0;
      background: linear-gradient(180deg, #a9c4f2, #307af3);
      transition: height .7s cubic-bezier(.22, 1, .36, 1), box-shadow .3s ease;
      position: relative;
    }

    .bar.active {
      box-shadow: 0 0 0 4px rgba(48, 122, 243, 0.15);
    }

    .bar-cap {
      position: absolute;
      top: -22px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 11.5px;
      font-weight: 800;
      color: #12b886;
      opacity: 0;
      transform: translateY(4px);
      transition: opacity .3s ease .15s, transform .3s ease .15s;
      white-space: nowrap;
    }

    .bar.grown .bar-cap {
      opacity: 1;
      transform: none;
    }

    .bar-lbl {
      font-size: 12px;
      font-weight: 700;
      color: var(--ink-soft);
      transition: color .3s ease;
      white-space: nowrap;
      text-align: center;
    }

    .bar-col.on .bar-lbl {
      color: var(--ink);
    }

    /* ━━━━ MESSAGE CARD ━━━━ */
    .msgslot {
      min-height: 66px;
      display: flex;
      align-items: center;
    }

    .msgcard {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
      border: 1.5px solid var(--tile-bd);
      border-radius: 14px;
      padding: 13px 14px;
      background: var(--white);
      animation: pushIn .42s cubic-bezier(.22, 1, .36, 1) both;
    }

    .msg-ic {
      width: 40px;
      height: 40px;
      flex: 0 0 40px;
      border-radius: 11px;
      display: grid;
      place-items: center;
      color: #fff;
    }

    .msgcard.onsite .msg-ic {
      background: #307af3;
    }

    .msgcard.offsite .msg-ic {
      background: #fee500;
      color: #3a2e00;
    }

    .msgcard.retention .msg-ic {
      background: #6b5bf2;
    }

    .msg-tx {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .msg-tag {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .02em;
    }

    .msgcard.onsite .msg-tag {
      color: #2f6fd6;
    }

    .msgcard.offsite .msg-tag {
      color: #8a7a00;
    }

    .msgcard.retention .msg-tag {
      color: #6b5bf2;
    }

    .msg-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--ink);
      letter-spacing: -0.01em;
    }

    .msg-add {
      font-size: 14px;
      font-weight: 800;
      color: #12b886;
      white-space: nowrap;
    }

    .recap {
      width: 100%;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      animation: riseIn .4s ease both;
    }

    .recap-chip {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 12.5px;
      font-weight: 700;
      color: var(--ink);
      background: var(--accent-bg);
      border: 1px solid var(--accent-bd);
      border-radius: 9999px;
      padding: 7px 13px;
    }

    .recap-chip .rc {
      width: 16px;
      height: 16px;
      flex: 0 0 16px;
      border-radius: 50%;
      background: #12b886;
      display: grid;
      place-items: center;
    }


    /* ━━━━ STATUS ━━━━ */
    .status {
      text-align: center;
      min-height: 44px;
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .hint {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      width: 100%;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: white;
      background: linear-gradient(110deg,
          color-mix(in srgb, var(--accent), black 10%) 0%,
          var(--accent) 50%,
          color-mix(in srgb, var(--accent), white 22%) 100%);
      border-radius: 14px;
      padding: 14px 18px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      box-shadow: 0 4px 18px color-mix(in srgb, var(--accent), transparent 44%);
    }

    .hint::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 60%;
      height: 100%;
      background: linear-gradient(105deg,
          transparent 0%, rgba(255, 255, 255, 0.52) 50%, transparent 100%);
      animation: shimmerSweep 2s ease-in-out infinite;
      pointer-events: none;
    }

    .s-line {
      font-size: 13.5px;
      font-weight: 500;
      color: var(--ink);
      animation: riseIn 0.38s ease both;
    }

    .s-stat {
      font-size: 14px;
      font-weight: 700;
      color: var(--accent);
      animation: riseIn 0.38s 0.08s ease both;
    }

    .s-stat b {
      font-size: 16px;
    }

    .replay-btn {
      margin-top: 4px;
      font-family: var(--font-sans);
      font-size: 12px;
      font-weight: 500;
      color: var(--ink-mid);
      background: none;
      border: 1px solid rgba(0, 0, 0, 0.12);
      border-radius: 9999px;
      padding: 6px 14px;
      cursor: pointer;
      animation: riseIn 0.38s 0.2s ease both;
      transition: color 0.18s ease, background 0.18s ease;
    }

    .replay-btn:hover {
      color: var(--ink);
      background: rgba(0, 0, 0, 0.04);
    }

    /* ━━━━ CTA BUTTON (캔버스·인스타피드와 동일한 커서 스타일 / 푸시 제품컬러) ━━━━ */
    .btn {
      position: absolute;
      left: 50%;
      top: 52%;
      transform: translate(-50%, -50%);
      z-index: 6;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 13px 22px;
      border-radius: 12px;
      background: linear-gradient(110deg,
          color-mix(in srgb, var(--accent), black 8%) 0%,
          var(--accent) 55%,
          color-mix(in srgb, var(--accent), white 18%) 100%);
      color: #fff;
      font-size: clamp(14px, 1.7vw, 18px);
      font-weight: 700;
      letter-spacing: -0.02em;
      white-space: nowrap;
      cursor: pointer;
      box-shadow: 4px 16px 22px rgba(48, 122, 243, 0.28);
      transition: box-shadow 0.2s ease;
    }

    .btn.idle {
      animation: btnPulse 2.2s ease-in-out infinite;
    }

    .btn:hover {
      box-shadow: 6px 18px 26px rgba(48, 122, 243, 0.42);
    }

    .btn:active {
      transform: translate(-50%, -50%) scale(0.97);
    }

    .btn.busy {
      cursor: default;
      opacity: 0.95;
    }

    /* 다시 보기 — 아웃라인 알약 (인라인, 하단 배치) */
    .btn.reset {
      position: static;
      transform: none;
      z-index: auto;
      background: rgba(255, 255, 255, 0.96);
      color: var(--ink);
      border: 1px solid var(--tile-bd);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12);
      padding: 11px 20px;
      font-size: 14px;
    }

    .btn.reset:hover {
      background: #fff;
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.16);
    }

    .btn.reset:active {
      transform: scale(0.97);
    }

    /* 데모 커서 (클릭 유도) */
    .btn-cursor {
      position: absolute;
      left: 50%;
      top: 52%;
      z-index: 7;
      width: 24px;
      height: 24px;
      margin-left: 40px;
      margin-top: 14px;
      pointer-events: none;
      color: #1a1a1a;
      filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.35));
      animation: cursorTap 2.2s ease-in-out infinite;
    }

    .btn-ring {
      position: absolute;
      left: 50%;
      top: 52%;
      z-index: 6;
      width: 16px;
      height: 16px;
      margin-left: 36px;
      margin-top: 18px;
      border-radius: 50%;
      pointer-events: none;
      background: rgba(48, 122, 243, 0.8);
      animation: ringPing 2.2s ease-out infinite;
    }

    /* ━━━━ CONFETTI ━━━━ */
    .conf-wrap {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      border-radius: inherit;
    }

    .conf-piece {
      position: absolute;
      animation: confDrop linear forwards;
    }

    /* ━━━━ KEYFRAMES ━━━━ */
    @keyframes idlePulse {

      0%,
      100% {
        box-shadow: 0 0 0 0px rgba(48, 122, 243, 0);
      }

      50% {
        box-shadow: 0 0 0 5px rgba(48, 122, 243, 0.12);
      }
    }

    @keyframes liveBlink {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.35;
      }
    }

    @keyframes popBadge {
      0% {
        transform: scale(0) rotate(-12deg);
        opacity: 0;
      }

      65% {
        transform: scale(1.2) rotate(3deg);
        opacity: 1;
      }

      100% {
        transform: scale(1) rotate(0);
        opacity: 1;
      }
    }

    @keyframes riseIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pushIn {
      from {
        opacity: 0;
        transform: translateY(20px) scale(0.97);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes breathe {

      0%,
      100% {
        opacity: 0.4;
      }

      50% {
        opacity: 0.82;
      }
    }

    @keyframes shimmerSweep {
      0% {
        transform: translateX(-180%);
      }

      100% {
        transform: translateX(350%);
      }
    }

    @keyframes btnPulse {
      0%, 100% { transform: translate(-50%, -50%) scale(1); }
      50% { transform: translate(-50%, -50%) scale(1.04); }
    }

    @keyframes cursorTap {
      0% { transform: translate(8px, 14px) scale(1); opacity: 0; }
      18% { transform: translate(0, 0) scale(1); opacity: 1; }
      40% { transform: translate(0, 0) scale(0.82); opacity: 1; }
      52% { transform: translate(0, 0) scale(1); opacity: 1; }
      82% { transform: translate(0, 0) scale(1); opacity: 1; }
      100% { transform: translate(8px, 14px) scale(1); opacity: 0; }
    }

    @keyframes ringPing {
      0%, 36% { transform: scale(0.3); opacity: 0; }
      44% { transform: scale(0.5); opacity: 0.85; }
      70% { transform: scale(2.6); opacity: 0; }
      100% { transform: scale(2.6); opacity: 0; }
    }

    @keyframes confDrop {
      0% {
        transform: translateY(-10px) rotate(0deg);
        opacity: 1;
      }

      100% {
        transform: translateY(560px) rotate(520deg);
        opacity: 0;
      }
    }

    @keyframes pulseRing {
      0% {
        box-shadow: 0 0 0 0 rgba(48, 122, 243, 0.35);
      }

      100% {
        box-shadow: 0 0 0 9px rgba(48, 122, 243, 0);
      }
    }
  </style>

<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    /* ── Icons ── */
    const UserIcon = () => (
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <circle cx="12" cy="8" r="3.4" stroke="currentColor" strokeWidth="1.8" />
        <path d="M5 20a7 7 0 0 1 14 0" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" />
      </svg>
    );
    const CheckIcon = ({ s = 10 }) => (
      <svg width={s} height={s} viewBox="0 0 11 11" fill="none" aria-hidden="true">
        <path d="M2 5.5L4.5 8L9 3" stroke="white" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" />
      </svg>
    );
    const BoltIcon = () => (
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M13 2L4.5 13.5H11l-1 8.5L19.5 10H13l0-8z" fill="white" />
      </svg>
    );
    const ClockIcon = () => (
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <circle cx="12" cy="12" r="9" stroke="currentColor" strokeWidth="2" />
        <path d="M12 7v5l3.2 2" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />
      </svg>
    );

    /* ── Confetti ── */
    const CONF_COLORS = ['#307AF3', '#A9C4F2', '#D8B48A', '#A7C0A1', '#7FA8E8', '#222222'];
    const Confetti = () => {
      const pieces = useMemo(() =>
        Array.from({ length: 30 }, (_, i) => ({
          id: i, left: 2 + Math.random() * 96,
          color: CONF_COLORS[i % CONF_COLORS.length],
          delay: Math.random() * 0.6, dur: 1.1 + Math.random() * 1.0,
          w: 5 + Math.random() * 7, h: 5 + Math.random() * 7,
          round: Math.random() > 0.45,
        })), []
      );
      return (
        <div className="conf-wrap">
          {pieces.map(p => (
            <div key={p.id} className="conf-piece" style={{
              left: `${p.left}%`, top: -10, width: p.w, height: p.h,
              background: p.color, borderRadius: p.round ? '50%' : '2px',
              animationDelay: `${p.delay}s`, animationDuration: `${p.dur}s`,
            }} />
          ))}
        </div>
      );
    };

    /* ── Count-up hook ── */
    const useCountUp = (target, durationMs, active) => {
      const [val, setVal] = useState(0);
      useEffect(() => {
        if (!active) { setVal(0); return; }
        let raf; const t0 = performance.now();
        const tick = (ts) => {
          const p = Math.min((ts - t0) / durationMs, 1);
          setVal(Math.floor((1 - Math.pow(1 - p, 3)) * target));
          if (p < 1) raf = requestAnimationFrame(tick); else setVal(target);
        };
        raf = requestAnimationFrame(tick);
        // backstop: guarantee final value even if rAF is throttled (e.g. backgrounded tab)
        const done = setTimeout(() => setVal(target), durationMs + 120);
        return () => { cancelAnimationFrame(raf); clearTimeout(done); };
      }, [active]);
      return val;
    };

    /* ── Stage icons ── */
    const BubbleIcon = () => (
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M4 5h16v11H9l-4 4V5z" stroke="currentColor" strokeWidth="1.8" strokeLinejoin="round" />
      </svg>
    );
    const RepeatIcon = () => (
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M4 9a6 6 0 0 1 10-3M20 15a6 6 0 0 1-10 3" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" />
        <path d="M14 3v3.5h-3.5M10 21v-3.5h3.5" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" />
      </svg>
    );

    /* ── Count-to hook (애니메이션: 이전값 → 새 target) ── */
    const useCountTo = (target, dur = 700) => {
      const [val, setVal] = useState(target);
      const fromRef = useRef(target);
      useEffect(() => {
        const from = fromRef.current;
        if (from === target) { return; }
        let raf; const t0 = performance.now();
        const tick = (ts) => {
          const p = Math.min((ts - t0) / dur, 1);
          const e = 1 - Math.pow(1 - p, 3);
          setVal(Math.round(from + (target - from) * e));
          if (p < 1) raf = requestAnimationFrame(tick);
          else { setVal(target); fromRef.current = target; }
        };
        raf = requestAnimationFrame(tick);
        const done = setTimeout(() => { setVal(target); fromRef.current = target; }, dur + 120);
        return () => { cancelAnimationFrame(raf); clearTimeout(done); };
      }, [target]);
      return val;
    };

    /* ── 단계별 자동 메시지 (고객유형 → 온/오프사이트 → 매출) ── */
    const STAGES = [
      { key: 'onsite',    tag: '온사이트 · 신규 방문',  title: '1초 회원가입 팝업',     bar: '신규 유입', h: 42,  cap: '+182만', Icon: UserIcon },
      { key: 'offsite',   tag: '오프사이트 · 이탈 고객', title: '카카오 알림톡 친구추가', bar: '재유입',   h: 72,  cap: '+253만', Icon: BubbleIcon },
      { key: 'retention', tag: '리텐션 · 기존 고객',     title: '맞춤 재구매 알림',       bar: '반복 구매', h: 100, cap: '+377만', Icon: RepeatIcon },
    ];
    const REV = [0, 1820000, 4350000, 8120000]; // 누적 매출 (예시값) // TODO: 실데이터

    /* ── Main Demo ── */
    const Demo = () => {
      const [phase, setPhase] = useState(0);   // 0 idle · 1 온사이트 · 2 오프사이트 · 3 리텐션 · 4 done
      const ids = useRef([]);
      const rev = useCountTo(REV[Math.min(phase, 3)], 700);

      const later = (fn, d) => ids.current.push(setTimeout(fn, d));
      const stop = () => { ids.current.forEach(clearTimeout); ids.current = []; };
      useEffect(() => stop, []);

      const start = () => {
        if (phase !== 0) return;
        later(() => setPhase(1), 300);
        later(() => setPhase(2), 1900);
        later(() => setPhase(3), 3500);
        later(() => setPhase(4), 5100);
      };
      const reset = (e) => { e.stopPropagation(); stop(); setPhase(0); };

      const cur = (phase >= 1 && phase <= 3) ? STAGES[phase - 1] : null;

      return (
        <div
          className={`demo ${phase === 0 ? '' : phase === 4 ? 'done' : 'running'}`}
          data-screen-label={`phase-${phase}`}
        >
          {phase === 4 && <Confetti key="conf" />}

          {/* top row */}
          <div className="top-row">
            <div className="badge">알파푸시</div>
            <div className={`auto-pill ${phase >= 1 ? 'on' : ''}`}>
              <span className="dot"></span>
              <span>{phase >= 1 ? '자동 발송 중' : '자동 발송 대기'}</span>
            </div>
          </div>

          {/* headline */}
          <h2 className="headline">
            비싸게 데려온 고객,<br />
            흘리지 않고 매출까지
          </h2>

          {/* revenue board (grower) */}
          <div className="board">
            <div className="rev">
              <span className="rev-label">자동 메시지로 올라간 매출</span>
              <div className="rev-numrow">
                <span className="rev-num">₩{rev.toLocaleString('ko-KR')}</span>
                <span className={`rev-delta ${cur ? 'show' : ''}`}>▲ 숨은 매출 {cur ? cur.cap : ''}</span>
              </div>
            </div>
            <div className="chart">
              {STAGES.map((s, i) => {
                const grown = phase >= i + 1;
                const active = phase === i + 1;
                return (
                  <div key={s.key} className={`bar-col ${grown ? 'on' : ''}`}>
                    <div className="bar-wrap">
                      <div className={`bar ${active ? 'active' : ''} ${grown ? 'grown' : ''}`} style={{ height: grown ? `${s.h}%` : '0%' }}>
                        <span className="bar-cap">{s.cap}</span>
                      </div>
                    </div>
                    <span className="bar-lbl">{s.bar}</span>
                  </div>
                );
              })}
            </div>
          </div>

          {/* idle CTA — 캔버스·인스타피드와 동일한 커서 스타일, 클릭영역 = 버튼 */}
          {phase === 0 && (
            <>
              <div className="btn idle" onClick={start}>탭하면 자동 메시지가 작동해요</div>
              <span className="btn-ring"></span>
              <span className="btn-cursor">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M5.5 3.2l13.4 7.7-5.7 1.1 3.3 6-2.6 1.4-3.3-6-3.8 4.2z" stroke="#fff" strokeWidth="1.2" strokeLinejoin="round" /></svg>
              </span>
            </>
          )}

          {/* current automated message / recap */}
          <div className="msgslot">
            {cur && (
              <div className={`msgcard ${cur.key}`} key={cur.key}>
                <span className="msg-ic"><cur.Icon /></span>
                <div className="msg-tx">
                  <span className="msg-tag">{cur.tag}</span>
                  <span className="msg-title">{cur.title}</span>
                </div>
                <span className="msg-add">{cur.cap}</span>
              </div>
            )}
            {phase === 4 && (
              <div className="recap">
                {STAGES.map(s => (
                  <span key={s.key} className="recap-chip"><span className="rc"><CheckIcon s={9} /></span>{s.title}</span>
                ))}
              </div>
            )}
          </div>

          {/* status */}
          <div className="status">
            {phase === 1 && <p className="s-line">온사이트 팝업으로 신규 고객을 즉시 회원으로</p>}
            {phase === 2 && <p className="s-line">카카오 알림톡으로 다시 부를 채널까지 확보</p>}
            {phase === 3 && <p className="s-line">맞춤 재구매 알림으로 반복 구매 고객 누적</p>}
            {phase === 4 && (
              <>
                <p className="s-line">고객 유형마다 자동으로 — 숨은 매출이 단계별로 ↑</p>
                <p className="s-stat">추가 매출 <b>₩{REV[3].toLocaleString('ko-KR')}</b></p>
                <button className="btn reset" onClick={reset}>다시 보기</button>
              </>
            )}
          </div>
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
  </script>
</body>

</html>
