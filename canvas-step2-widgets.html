<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>알파캔버스 — 위젯 편집 데모</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
  <style>
    :root {
      --teal: #00B7A8;
      --teal-600: #0D9488;
      --ink: #1a1a1a;
      --dim: #5d6374;
      --faint: #8e929e;
      --line: #e3e4e7;
      --soft: #f5f5f6;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }

    body {
      font-family: 'Pretendard Variable', 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #fff;
      color: var(--ink);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    .wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 24px;
      gap: 16px;
    }

    .head { display: flex; flex-direction: column; gap: 8px; }

    .chips { display: flex; gap: 8px; }

    .tag {
      display: inline-flex; align-items: center; height: 24px; padding: 0 10px;
      border-radius: 9999px; font-size: 12px; font-weight: 700; color: #fff; background: var(--teal);
    }

    .tag.step { background: transparent; color: var(--teal-600); border: 1px solid #92F3E6; }

    .title { font-size: clamp(20px, 3vw, 28px); font-weight: 800; letter-spacing: -0.02em; line-height: 1.3; }

    .sub { font-size: 14px; color: var(--dim); line-height: 1.6; }

    /* 위젯 팔레트 */
    .palette { display: flex; flex-wrap: wrap; gap: 10px; }

    .widget {
      display: flex; align-items: center; gap: 10px;
      border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px;
      background: #fff; cursor: pointer; transition: border-color .16s ease, background .16s ease, transform .1s ease;
    }

    .widget:hover { border-color: #92F3E6; background: rgba(0, 183, 168, .05); }
    .widget:active { transform: scale(.98); }

    .widget.on { border-color: var(--teal); background: rgba(0, 183, 168, .07); }

    .w-ic {
      width: 34px; height: 34px; flex: 0 0 34px; border-radius: 9px;
      display: grid; place-items: center; background: var(--soft); color: var(--teal-600); font-size: 18px;
    }

    .widget.on .w-ic { background: var(--teal); color: #fff; }

    .w-tx { display: flex; flex-direction: column; }
    .w-tx b { font-size: 14px; font-weight: 700; letter-spacing: -0.01em; }
    .w-tx span { font-size: 12px; color: var(--faint); }

    /* 미리보기 캔버스 */
    .preview {
      flex: 1; min-height: 240px; border: 1px solid var(--line); border-radius: 14px;
      background: #f7f4f2; padding: 16px; display: flex; flex-direction: column; gap: 10px; overflow: auto;
    }

    .pv-empty {
      flex: 1; display: grid; place-items: center; text-align: center; color: var(--faint);
      font-size: 14px; line-height: 1.6;
    }

    .pv-card {
      display: flex; align-items: center; gap: 12px; background: #fff; border-radius: 12px; padding: 14px 16px;
      box-shadow: 0 2px 10px rgba(0, 0, 0, .05); animation: pop .35s cubic-bezier(.34, 1.56, .64, 1) both;
    }

    .pv-ic {
      width: 36px; height: 36px; flex: 0 0 36px; border-radius: 9px; display: grid; place-items: center;
      background: rgba(0, 183, 168, .12); color: var(--teal-600); font-size: 18px;
    }

    .pv-tx { flex: 1; font-size: 13.5px; font-weight: 600; color: #3a2e26; }
    .pv-cta { font-size: 12px; font-weight: 700; color: #fff; background: var(--teal); padding: 7px 12px; border-radius: 8px; }

    @keyframes pop { from { opacity: 0; transform: translateY(-6px) scale(.97); } to { opacity: 1; transform: none; } }

    .hint { font-size: 12.5px; color: var(--faint); text-align: center; }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="head">
      <div class="chips"><span class="tag">알파캔버스</span><span class="tag step">STEP 2</span></div>
      <h1 class="title">다양한 위젯으로 자유롭게 편집</h1>
      <p class="sub">쿠폰·타임세일·실시간 알림·리뷰 등 구매전환 위젯을 골라 페이지에 바로 얹어보세요.</p>
    </div>

    <div class="palette" id="palette"></div>

    <div class="preview" id="preview">
      <div class="pv-empty">위젯을 눌러 페이지에 추가해보세요</div>
    </div>
    <p class="hint" id="hint">위젯을 탭하면 미리보기에 추가돼요</p>
  </div>

  <script>
    const WIDGETS = [
      { id: 'coupon', emo: '🎟️', name: '할인 쿠폰', desc: '첫 구매 10% 할인', tx: '첫 구매 10% 할인 쿠폰', cta: '받기' },
      { id: 'timer', emo: '⏰', name: '타임 세일', desc: '마감 임박 카운트', tx: '타임 특가 마감까지 02:14:09', cta: '구매' },
      { id: 'live', emo: '🔔', name: '실시간 알림', desc: '방금 구매 소식', tx: '방금 3명이 구매했어요', cta: '' },
      { id: 'review', emo: '⭐', name: '리뷰 별점', desc: '평점·후기 수', tx: '4.9 · 리뷰 12,402개', cta: '' },
    ];
    const placed = new Set();
    const palette = document.getElementById('palette');
    const preview = document.getElementById('preview');
    const hint = document.getElementById('hint');

    function render() {
      palette.innerHTML = '';
      WIDGETS.forEach(w => {
        const el = document.createElement('div');
        el.className = 'widget' + (placed.has(w.id) ? ' on' : '');
        el.innerHTML = `<span class="w-ic">${w.emo}</span><span class="w-tx"><b>${w.name}</b><span>${w.desc}</span></span>`;
        el.onclick = () => { placed.has(w.id) ? placed.delete(w.id) : placed.add(w.id); render(); };
        palette.appendChild(el);
      });
      const on = WIDGETS.filter(w => placed.has(w.id));
      if (!on.length) {
        preview.innerHTML = '<div class="pv-empty">위젯을 눌러 페이지에 추가해보세요</div>';
        hint.textContent = '위젯을 탭하면 미리보기에 추가돼요';
      } else {
        preview.innerHTML = '';
        on.forEach(w => {
          const c = document.createElement('div'); c.className = 'pv-card';
          c.innerHTML = `<span class="pv-ic">${w.emo}</span><span class="pv-tx">${w.tx}</span>` + (w.cta ? `<span class="pv-cta">${w.cta}</span>` : '');
          preview.appendChild(c);
        });
        hint.textContent = `${on.length}개 위젯이 추가됐어요 · 다시 누르면 제거`;
      }
    }
    render();
  </script>
</body>

</html>
