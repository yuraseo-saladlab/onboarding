<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>캔버스 — 온보딩 인터랙션</title>

  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap"
    rel="stylesheet">

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js"
    integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L"
    crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
    integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm"
    crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
    integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y"
    crossorigin="anonymous"></script>

  <style>
    :root {
      --font-sans: 'Pretendard Variable', 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;

      /* ── Figma design tokens ── */
      --teal-500: #00B7A8;
      --teal-600: #0D9488;
      --teal-200: #92F3E6;
      --teal-deep: #00A597;
      --teal-light: #38C7BB;

      --bg-primary: #ffffff;
      --bg-tertiary: #f5f5f6;
      --border-default: #e3e4e7;
      --gray-200: #d6d7db;

      --text-primary: #2a2d38;
      --text-tertiary: #5d6374;
      --text-placeholder: #8e929e;
      --ink: #1a1a1a;

      --brand: #C2603F;
      --brand-bg: rgba(194, 96, 63, 0.08);
      --brand-bd: rgba(194, 96, 63, 0.22);
      --tile-bd: rgba(17, 17, 17, 0.06);

      --r-sm: 4px;
      --r-lg: 8px;
      --r-3xl: 20px;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
    }

    body {
      font-family: var(--font-sans);
      background: var(--bg-primary);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      color: var(--ink);
    }

    #root {
      width: 100%;
      display: grid;
      place-items: center;
      position: relative;
    }

    /* ━━━━ DEMO CARD ━━━━ */
    .demo {
      width: 100%;
      max-width: 1200px;
      background: var(--bg-primary);
      border-radius: var(--r-3xl);
      padding: 24px;
      position: relative;
      overflow: hidden;
      box-shadow: 4px 16px 30px 0 rgba(0, 0, 0, 0.2);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* ── head ── */
    .head {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .chips {
      display: flex;
      gap: 8px;
      align-items: flex-start;
    }

    .chip-tag {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 24px;
      padding: 0 8px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: -0.01em;
      white-space: nowrap;
      background: var(--teal-500);
      color: #fff;
    }

    .chip-tag.beta {
      background: transparent;
      color: var(--teal-600);
      border: 1px solid var(--teal-200);
    }

    .title {
      font-size: clamp(22px, 3.4vw, 40px);
      font-weight: 700;
      color: var(--ink);
      line-height: 1.3;
      letter-spacing: -0.02em;
    }

    /* ━━━━ BODY (2-column) ━━━━ */
    .body {
      flex: 1 1 0;
      min-height: 0;
      display: flex;
      gap: 16px;
      align-items: stretch;
    }

    /* ── sidebar ── */
    .side {
      width: 180px;
      flex-shrink: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* 완성도 / CTA는 고정, 블록 목록만 내부 스크롤 → CTA 항상 보임 */
    .side-scroll {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .prog,
    .cta {
      flex-shrink: 0;
    }

    /* 완성도 pill */
    .prog {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-tertiary);
      border: 1px solid transparent;
      border-radius: var(--r-lg);
      padding: 8px 12px;
    }

    /* 완료: teal weak/outline (모양 동일, 색만) */
    .prog.done { background: rgba(0, 183, 168, 0.06); border-color: rgba(0, 183, 168, 0.4); }
    .prog.done .prog-label, .prog.done .prog-label .num { color: var(--teal-600); }

    .prog-label {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-tertiary);
      letter-spacing: -0.01em;
      white-space: nowrap;
    }

    .prog-label .num {
      font-variant-numeric: tabular-nums;
    }

    .prog-bar {
      flex: 1 1 0;
      min-width: 0;
      height: 5px;
      border-radius: 9999px;
      background: var(--gray-200);
      overflow: hidden;
    }

    .prog-fill {
      height: 100%;
      border-radius: 9999px;
      background: var(--teal-500);
      transition: width 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* block / widget groups */
    .group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .group-label {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-tertiary);
      letter-spacing: -0.01em;
    }

    .item {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-primary);
      border: 1px solid var(--border-default);
      border-radius: var(--r-lg);
      padding: 9px 8px;
      cursor: pointer;
      transition: border-color 0.18s ease, background 0.18s ease, opacity 0.25s ease, transform 0.12s ease;
    }

    .item:hover {
      border-color: var(--teal-200);
      background: rgba(0, 183, 168, 0.05);
    }

    .item:active {
      transform: scale(0.98);
    }

    .item.placed {
      opacity: 0.5;
      pointer-events: none;
      border-color: var(--teal-200);
      background: rgba(0, 183, 168, 0.06);
    }

    .item-ic {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      color: var(--text-primary);
      display: grid;
      place-items: center;
    }

    .item.placed .item-ic {
      color: var(--teal-600);
    }

    .item-label {
      flex: 1 1 0;
      min-width: 0;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-primary);
      letter-spacing: -0.01em;
      line-height: 1.5;
      white-space: nowrap;
    }

    .item-add {
      width: 24px;
      height: 24px;
      flex-shrink: 0;
      border-radius: var(--r-sm);
      display: grid;
      place-items: center;
      color: var(--text-tertiary);
    }

    .item:hover .item-add {
      color: var(--teal-600);
    }

    .item.placed .item-add {
      color: var(--teal-500);
    }

    /* CTA */
    .cta {
      width: 100%;
      border: 1px solid var(--teal-500);
      border-radius: var(--r-lg);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.01em;
      white-space: nowrap;
      background: linear-gradient(60.5deg, #00A597 13%, #00B7A8 50%, #38C7BB 87%);
      box-shadow: 0 0 8px 0 rgba(0, 183, 168, 0.5);
      transition: transform 0.12s ease, box-shadow 0.2s ease;
    }

    .cta::before {
      content: '';
      position: absolute;
      inset: -1px;
      background: linear-gradient(84deg, rgba(255, 255, 255, 0) 3%, rgba(255, 255, 255, 0.52) 50%, rgba(255, 255, 255, 0) 97%);
      pointer-events: none;
      opacity: 0;
    }

    .cta.idle::before {
      opacity: 1;
      animation: shimmerSweep 2.4s ease-in-out infinite;
    }

    .cta:hover {
      box-shadow: 0 4px 14px 0 rgba(0, 183, 168, 0.55);
    }

    .cta:active {
      transform: scale(0.98);
    }

    .cta.busy {
      cursor: default;
      opacity: 0.92;
    }

    /* 다시 하기 — 중립 색 (teal CTA와 구분) */
    .cta.reset {
      background: #fff;
      color: var(--text-tertiary);
      border-color: var(--border-default);
      box-shadow: none;
    }

    .cta.reset:hover {
      background: var(--bg-tertiary);
      color: var(--text-primary);
      box-shadow: none;
    }

    .cta .cta-label {
      position: relative;
      z-index: 1;
    }

    /* idle 펄스 — 누르고 싶게 살짝 들썩 */
    .cta.idle {
      animation: ctaPulse 2.2s ease-in-out infinite;
    }

    /* 데모 커서 — CTA 위로 올라와 탭하는 모션 */
    .cta-cursor {
      position: absolute;
      right: 16px;
      bottom: 7px;
      width: 22px;
      height: 22px;
      z-index: 3;
      pointer-events: none;
      color: #1a1a1a;
      filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.3));
      animation: cursorTap 2.2s ease-in-out infinite;
    }

    .cta-cursor svg {
      display: block;
    }

    /* 탭 순간 퍼지는 링 */
    .cta-ring {
      position: absolute;
      right: 20px;
      bottom: 16px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      z-index: 2;
      pointer-events: none;
      background: rgba(255, 255, 255, 0.7);
      animation: ringPing 2.2s ease-out infinite;
    }

    @keyframes ctaPulse {

      0%,
      100% {
        transform: scale(1);
        box-shadow: 0 0 8px 0 rgba(0, 183, 168, 0.5);
      }

      50% {
        transform: scale(1.025);
        box-shadow: 0 6px 18px 0 rgba(0, 183, 168, 0.6);
      }
    }

    @keyframes cursorTap {
      0% {
        transform: translate(8px, 14px) scale(1);
        opacity: 0;
      }

      18% {
        transform: translate(0, 0) scale(1);
        opacity: 1;
      }

      40% {
        transform: translate(0, 0) scale(0.82);
        opacity: 1;
      }

      /* press */
      52% {
        transform: translate(0, 0) scale(1);
        opacity: 1;
      }

      /* release */
      82% {
        transform: translate(0, 0) scale(1);
        opacity: 1;
      }

      100% {
        transform: translate(8px, 14px) scale(1);
        opacity: 0;
      }
    }

    @keyframes ringPing {

      0%,
      36% {
        transform: scale(0.3);
        opacity: 0;
      }

      44% {
        transform: scale(0.5);
        opacity: 0.85;
      }

      /* fires at press */
      70% {
        transform: scale(2.6);
        opacity: 0;
      }

      100% {
        transform: scale(2.6);
        opacity: 0;
      }
    }

    /* ── browser preview ── */
    .preview {
      flex: 1 1 0;
      min-width: 0;
      display: flex;
      flex-direction: column;
      background: var(--bg-tertiary);
      border: 1px solid var(--border-default);
      border-radius: var(--r-lg);
      overflow: hidden;
    }

    .browser-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px 9px;
      background: #fff;
      border-bottom: 1px solid rgba(17, 17, 17, 0.06);
    }

    .browser-bar .dots {
      display: flex;
      gap: 5px;
    }

    .browser-bar .dots i {
      width: 8px;
      height: 8px;
      border-radius: var(--r-sm);
      background: #dcdcd8;
      display: block;
    }

    .browser-bar .url {
      margin-left: 4px;
      font-family: var(--font-mono);
      font-weight: 700;
      font-size: 11px;
      letter-spacing: -0.02em;
      color: rgba(26, 26, 26, 0.5);
      white-space: nowrap;
    }

    .browser-bar .brand-tag {
      margin-left: auto;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 10.5px;
      font-weight: 700;
      color: var(--ink);
      letter-spacing: 0.02em;
    }

    .browser-bar .brand-tag i {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--brand);
      display: block;
    }

    .browser-body {
      flex: 1 1 0;
      min-height: 0;
      overflow-y: auto;
      scroll-behavior: smooth;
      overscroll-behavior: contain;
      background: #f7f4f2;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .browser-body.is-empty {
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 24px;
    }

    .browser-body::-webkit-scrollbar {
      width: 6px;
    }

    .browser-body::-webkit-scrollbar-thumb {
      background: rgba(0, 0, 0, 0.13);
      border-radius: 9999px;
    }

    .browser-body::-webkit-scrollbar-track {
      background: transparent;
    }

    .empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      text-align: center;
      color: var(--text-placeholder);
    }

    .empty .e-title {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.3;
    }

    .empty .e-sub {
      font-size: 14px;
      font-weight: 400;
      letter-spacing: -0.01em;
      line-height: 1.5;
    }

    /* ━━━━ placed storefront sections (MAISON) ━━━━ */
    .sec {
      animation: dropPop 0.42s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }

    /* ── header ── */
    .sf-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #fff;
      border-radius: 12px;
      padding: 14px 18px;
    }

    .sf-logo {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.4em;
      color: #2b2422;
    }

    .sf-nav {
      display: flex;
      align-items: center;
      gap: 16px;
      color: #6b5f58;
    }

    .sf-nav span {
      font-size: 12px;
      font-weight: 500;
      letter-spacing: -0.01em;
    }

    .sf-nav .cart {
      font-size: 15px;
      line-height: 1;
    }

    /* ── hero ── */
    .sf-hero {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      padding: 22px 22px 20px;
      min-height: 150px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 9px;
      background: linear-gradient(90deg, #d9c7b5 0%, #e5ddd2 100%);
      isolation: isolate;
    }

    .sf-hero-bg {
      position: absolute;
      inset: 0;
      background-image: url('assets/canvas/hero.png');
      background-size: cover;
      background-position: center 30%;
      background-repeat: no-repeat;
      z-index: -1;
    }

    .sf-hero-bg::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(10, 56, 21, 0.3);
    }

    .sf-hero-eyebrow {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.14em;
      color: #beff74;
    }

    .sf-hero-title {
      font-size: 21px;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: #fff;
      line-height: 1.2;
    }

    .sf-hero-sub {
      font-size: 12px;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.92);
      letter-spacing: -0.01em;
    }

    .sf-hero-cta {
      align-self: flex-start;
      margin-top: 4px;
      background: rgba(255, 255, 255, 0.7);
      color: #426c11;
      font-size: 12px;
      font-weight: 600;
      padding: 9px 16px;
      border-radius: 8px;
      letter-spacing: -0.01em;
      white-space: nowrap;
      backdrop-filter: blur(2px);
    }

    /* ── best seller ── */
    .sf-coll {
      background: #fff;
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .sf-coll-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .sf-coll-title {
      font-size: 16px;
      font-weight: 600;
      color: #2b2422;
      letter-spacing: -0.02em;
    }

    .sf-coll-more {
      font-size: 12px;
      font-weight: 400;
      color: #8b4e24;
      letter-spacing: -0.01em;
    }

    .sf-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    .sf-pcard {
      display: flex;
      flex-direction: column;
      gap: 7px;
      min-width: 0;
    }

    .sf-pimg {
      aspect-ratio: 1086 / 1448;
      border-radius: 10px;
      overflow: hidden;
      background: linear-gradient(145deg, #b49a86, rgba(180, 154, 134, 0.78));
    }

    .sf-pimg img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .sf-pname {
      font-size: 12.5px;
      font-weight: 400;
      color: #2b2422;
      letter-spacing: -0.01em;
      line-height: 1.4;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .sf-pprice {
      display: flex;
      gap: 4px;
      align-items: baseline;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .sf-pprice .off {
      color: #e62c35;
    }

    .sf-pprice .amt {
      color: #2b2422;
    }

    /* ── conversion widget row ── */
    .sf-wrow {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .sf-wcard {
      flex: 1 1 160px;
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 10px;
      background: #efe7e2;
      border-radius: 12px;
      padding: 12px;
    }

    .sf-wic {
      width: 32px;
      height: 32px;
      flex-shrink: 0;
      border-radius: 8px;
      background: #b5917b;
      color: #fff;
      display: grid;
      place-items: center;
    }

    .sf-wtx {
      flex: 1 1 0;
      min-width: 0;
      font-size: 13px;
      font-weight: 600;
      color: #3a2e26;
      letter-spacing: -0.01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .sf-wtx .star {
      color: #ff6601;
    }

    .sf-wtime {
      flex-shrink: 0;
      font-size: 13px;
      font-weight: 600;
      color: #e62c35;
      letter-spacing: -0.01em;
    }

    .sf-wbtn {
      flex-shrink: 0;
      background: #ac5216;
      color: #fff;
      font-size: 11px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 6px;
      white-space: nowrap;
    }

    /* ── footer ── */
    .sf-foot {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 18px 0;
    }

    .sf-foot-brand {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.4em;
      color: #3a2e26;
    }

    .sf-foot-links {
      display: flex;
      gap: 16px;
    }

    .sf-foot-links span {
      font-size: 10px;
      font-weight: 400;
      color: #9c8f86;
    }

    /* ━━━━ CONFETTI ━━━━ */
    .conf-wrap {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      border-radius: inherit;
    }

    .conf-piece {
      position: absolute;
      animation: confDrop linear forwards;
    }

    /* ━━━━ KEYFRAMES ━━━━ */
    @keyframes dropPop {
      0% {
        transform: translateY(-7px) scale(0.96);
      }

      60% {
        transform: translateY(0) scale(1.02);
      }

      100% {
        transform: translateY(0) scale(1);
      }
    }

    @keyframes shimmerSweep {
      0% {
        transform: translateX(-120%);
      }

      100% {
        transform: translateX(120%);
      }
    }

    @keyframes confDrop {
      0% {
        transform: translateY(-10px) rotate(0deg);
        opacity: 1;
      }

      100% {
        transform: translateY(720px) rotate(520deg);
        opacity: 0;
      }
    }

    /* 넓은(2단) 레이아웃: 목록만 스크롤시켜 CTA를 사이드바 하단에 고정.
       임베드 우측 패널(창 960px≈438px / 1080px≈558px)에서도 2단을 유지해
       예시·CTA가 잘리지 않게 함 */
    @media (min-width: 360px) {
      .side-scroll {
        flex: 1 1 0;
        min-height: 0;
        overflow-y: auto;
        padding-right: 2px;
      }

      .side-scroll::-webkit-scrollbar {
        width: 5px;
      }

      .side-scroll::-webkit-scrollbar-thumb {
        background: rgba(0, 0, 0, 0.12);
        border-radius: 9999px;
      }
    }

    /* 아주 좁은 화면(≤359): 세로 스택 — 목록만 스크롤해 CTA·미리보기는 항상 보이게 */
    @media (max-width: 359px) {
      .body {
        flex-direction: column;
        gap: 12px;
      }

      .side {
        width: 100%;
        max-height: 46%;
        min-height: 0;
      }

      .side-scroll {
        flex: 1 1 0;
        min-height: 0;
        overflow-y: auto;
        padding-right: 2px;
      }

      .preview {
        flex: 1 1 0;
        min-height: 200px;
      }
    }
  </style>
  <style id="embed-fill">
    html,
    body {
      background: #fff !important;
    }

    body {
      margin: 0 !important;
      padding: 0 !important;
      min-height: 100vh;
      display: flex !important;
      flex-direction: column !important;
    }

    #root {
      flex: 1 1 auto !important;
      display: flex !important;
      flex-direction: column !important;
      width: 100% !important;
    }

    .demo {
      flex: 1 1 auto !important;
      max-width: none !important;
      width: 100% !important;
      border-radius: 0 !important;
      box-shadow: none !important;
    }
  </style>
</head>

<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    /* ── Icons (16px line) ── */
    const HeaderIcon = () => (
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <rect x="3.5" y="5" width="17" height="14" rx="2.5" stroke="currentColor" strokeWidth="1.7" />
        <path d="M3.5 9.5h17" stroke="currentColor" strokeWidth="1.7" />
      </svg>
    );
    const HeroIcon = () => (
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <rect x="3.5" y="5" width="17" height="14" rx="2.5" stroke="currentColor" strokeWidth="1.7" />
        <circle cx="9" cy="10" r="1.6" fill="currentColor" />
        <path d="M5 17l4-4 3.5 3 2.5-2.5L19 17" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round" />
      </svg>
    );
    const GridIcon = () => (
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <rect x="4" y="4" width="7" height="7" rx="1.6" stroke="currentColor" strokeWidth="1.7" />
        <rect x="13" y="4" width="7" height="7" rx="1.6" stroke="currentColor" strokeWidth="1.7" />
        <rect x="4" y="13" width="7" height="7" rx="1.6" stroke="currentColor" strokeWidth="1.7" />
        <rect x="13" y="13" width="7" height="7" rx="1.6" stroke="currentColor" strokeWidth="1.7" />
      </svg>
    );
    const FooterIcon = () => (
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <rect x="3.5" y="5" width="17" height="14" rx="2.5" stroke="currentColor" strokeWidth="1.7" />
        <path d="M3.5 14.5h17" stroke="currentColor" strokeWidth="1.7" />
      </svg>
    );
    const TicketIcon = () => (
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M4 8a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2 2 2 0 0 0 0 4 2 2 0 0 1-2 2H6a2 2 0 0 1-2-2 2 2 0 0 0 0-4z" stroke="currentColor" strokeWidth="1.7" strokeLinejoin="round" />
        <path d="M13 6v12" stroke="currentColor" strokeWidth="1.7" strokeDasharray="2 2.4" />
      </svg>
    );
    const ClockIcon = () => (
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <circle cx="12" cy="12" r="8.5" stroke="currentColor" strokeWidth="1.7" />
        <path d="M12 7.5V12l3 1.8" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round" />
      </svg>
    );
    const BellIcon = () => (
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M6 9a6 6 0 0 1 12 0c0 5 2 6 2 6H4s2-1 2-6z" stroke="currentColor" strokeWidth="1.7" strokeLinejoin="round" />
        <path d="M10 19a2 2 0 0 0 4 0" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round" />
      </svg>
    );
    const StarIcon = () => (
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M12 3.5l2.4 4.9 5.4.8-3.9 3.8.92 5.4L12 16.3 7.18 18.4l.92-5.4-3.9-3.8 5.4-.8L12 3.5z" stroke="currentColor" strokeWidth="1.6" strokeLinejoin="round" />
      </svg>
    );
    const CartIcon = () => (
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <circle cx="9" cy="20" r="1.3" fill="currentColor" /><circle cx="18" cy="20" r="1.3" fill="currentColor" />
        <path d="M2 4h2.2l2 11.2a1.4 1.4 0 0 0 1.4 1.1h8.6a1.4 1.4 0 0 0 1.4-1.05L20.5 8H5" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round" />
      </svg>
    );
    const PlusIcon = () => (
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M12 5v14M5 12h14" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" />
      </svg>
    );
    const CheckIcon = () => (
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M5 12.5L10 17L19 7" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" />
      </svg>
    );

    const ICONS = {
      header: HeaderIcon, hero: HeroIcon, grid: GridIcon, footer: FooterIcon,
      coupon: TicketIcon, live: BellIcon, timer: ClockIcon, review: StarIcon,
    };

    /* ── Catalogue (order matches Figma) ── */
    const LAYOUT = [
      { id: 'header', icon: 'header', label: '헤더 / 메뉴' },
      { id: 'hero', icon: 'hero', label: '히어로 배너' },
      { id: 'grid', icon: 'grid', label: '상품 컬렉션' },
      { id: 'footer', icon: 'footer', label: '푸터' },
    ];
    const WIDGETS = [
      { id: 'coupon', icon: 'coupon', label: '할인 쿠폰', delta: 2.6 },
      { id: 'live', icon: 'live', label: '실시간 알림', delta: 1.9 },
      { id: 'timer', icon: 'timer', label: '타임 세일', delta: 2.2 },
      { id: 'review', icon: 'review', label: '리뷰 별점', delta: 1.6 },
    ];
    const LAYOUT_IDS = LAYOUT.map(b => b.id);
    const BY_ID = Object.fromEntries([...LAYOUT, ...WIDGETS].map(b => [b.id, b]));
    const BASE_CONV = 2.4;

    /* ── filled star (widget icon) ── */
    const StarFill = () => (
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M12 3.2l2.6 5.3 5.8.85-4.2 4.1 1 5.75L12 16.6 6.8 19.2l1-5.75-4.2-4.1 5.8-.85z" />
      </svg>
    );

    /* ── storefront product catalogue (Figma) ── */
    const PRODUCTS = [
      { src: 'assets/canvas/p1.png', name: '여름 청순 바람막이', off: '48%', price: '36,000원', g: 'linear-gradient(145deg, #b49a86, rgba(180,154,134,.78))' },
      { src: 'assets/canvas/p2.png', name: '여름맞이 린넨 카라 반팔티', off: '50%', price: '32,000원', g: 'linear-gradient(145deg, #a9bba4, rgba(169,187,164,.78))' },
      { src: 'assets/canvas/p3.png', name: '시원한 워싱 데님 반바지', off: '50%', price: '29,900원', g: 'linear-gradient(145deg, #b8a6cc, rgba(184,166,204,.78))' },
      { src: 'assets/canvas/p4.png', name: '마린 카라 민소매 플레어 원피스', off: '25%', price: '59,900원', g: 'linear-gradient(145deg, #a8b0c2, rgba(168,176,194,.78))' },
    ];

    /* ── conversion widget card content ── */
    const WIDGET_CARD = {
      coupon: { Icon: TicketIcon, body: <><span className="sf-wtx">첫 구매 10% 할인 쿠폰</span><span className="sf-wbtn">받기</span></> },
      live: { Icon: BellIcon, body: <span className="sf-wtx">방금 3명이 구매했어요</span> },
      timer: { Icon: ClockIcon, body: <><span className="sf-wtx">타임 특가 마감까지</span><span className="sf-wtime">02:14:09</span></> },
      review: { Icon: StarFill, body: <span className="sf-wtx"><span className="star">4.9</span> · 리뷰 12,402개</span> },
    };
    const WidgetCard = ({ id }) => {
      const { Icon, body } = WIDGET_CARD[id];
      return (
        <div className="sf-wcard">
          <span className="sf-wic"><Icon /></span>
          {body}
        </div>
      );
    };

    /* ── Storefront section renderer (layout blocks) ── */
    const Section = ({ id }) => {
      switch (id) {
        case 'header': return (
          <div className="sec sf-header">
            <span className="sf-logo">MAISON</span>
            <span className="sf-nav"><span>NEW</span><span>BEST</span><span>SALE</span><span className="cart">🛒</span></span>
          </div>
        );
        case 'hero': return (
          <div className="sec sf-hero">
            <span className="sf-hero-bg"></span>
            <span className="sf-hero-eyebrow">2026 SPRING COLLECTION</span>
            <span className="sf-hero-title">지금, 새로운 무드</span>
            <span className="sf-hero-sub">봄을 여는 신상 컬렉션을 만나보세요</span>
            <span className="sf-hero-cta">컬렉션 보기</span>
          </div>
        );
        case 'grid': return (
          <div className="sec sf-coll">
            <div className="sf-coll-head"><span className="sf-coll-title">베스트 셀러</span><span className="sf-coll-more">전체보기</span></div>
            <div className="sf-grid">
              {PRODUCTS.map(p => (
                <div className="sf-pcard" key={p.name}>
                  <div className="sf-pimg" style={{ background: p.g }}><img src={p.src} alt={p.name} loading="lazy" /></div>
                  <span className="sf-pname">{p.name}</span>
                  <span className="sf-pprice"><span className="off">{p.off}</span><span className="amt">{p.price}</span></span>
                </div>
              ))}
            </div>
          </div>
        );
        case 'footer': return (
          <div className="sec sf-foot">
            <span className="sf-foot-brand">MAISON</span>
            <span className="sf-foot-links"><span>이용약관</span><span>고객센터</span><span>@maison.official</span></span>
          </div>
        );
        default: return null;
      }
    };

    /* ── Confetti ── */
    const CONF_COLORS = ['#00B7A8', '#C2603F', '#ECD9CE', '#7FD4C9', '#009488', '#222222'];
    const Confetti = () => {
      const pieces = useMemo(() =>
        Array.from({ length: 30 }, (_, i) => ({
          id: i, left: 2 + Math.random() * 96,
          color: CONF_COLORS[i % CONF_COLORS.length],
          delay: Math.random() * 0.55, dur: 1.1 + Math.random() * 1.0,
          w: 5 + Math.random() * 7, h: 5 + Math.random() * 7,
          round: Math.random() > 0.45,
        })), []
      );
      return (
        <div className="conf-wrap">
          {pieces.map(p => (
            <div key={p.id} className="conf-piece" style={{
              left: `${p.left}%`, top: -10, width: p.w, height: p.h,
              background: p.color, borderRadius: p.round ? '50%' : '2px',
              animationDelay: `${p.delay}s`, animationDuration: `${p.dur}s`,
            }} />
          ))}
        </div>
      );
    };

    /* ── Sidebar item ── */
    const Item = ({ b, placed, onClick }) => {
      const Ic = ICONS[b.icon];
      return (
        <div className={`item ${placed ? 'placed' : ''}`} onClick={onClick}>
          <span className="item-ic"><Ic /></span>
          <span className="item-label">{b.label}</span>
          <span className="item-add">{placed ? <CheckIcon /> : <PlusIcon />}</span>
        </div>
      );
    };

    /* ── Main Demo ── */
    const Demo = () => {
      const [placed, setPlaced] = useState([]);   // ids in placement order
      const [autoRunning, setAutoRunning] = useState(false);
      const bodyRef = useRef(null);
      const timersRef = useRef([]);

      const placedLayout = LAYOUT_IDS.filter(id => placed.includes(id));
      const placedWidgets = placed.filter(id => !LAYOUT_IDS.includes(id));
      const layoutDone = placedLayout.length === LAYOUT.length;
      const everythingDone = placed.length === LAYOUT.length + WIDGETS.length;
      const progress = Math.round((placedLayout.length / LAYOUT.length) * 100);
      const conv = BASE_CONV + placedWidgets.reduce((s, id) => s + BY_ID[id].delta, 0);

      // build a coherent page: header → hero → grid → [widget row] → footer
      // widgets collapse into a single '__widgets__' row token tucked above the footer
      const renderTokens = useMemo(() => {
        const out = [];
        let widgetsEmitted = false;
        placedLayout.forEach(id => {
          if (id === 'footer') {
            if (placedWidgets.length) { out.push('__widgets__'); widgetsEmitted = true; }
            out.push('footer');
          } else out.push(id);
        });
        if (!widgetsEmitted && placedWidgets.length) out.push('__widgets__');
        return out;
      }, [placed.join(',')]);

      const clearTimers = () => { timersRef.current.forEach(clearTimeout); timersRef.current = []; };
      const place = (id) => setPlaced(p => (p.includes(id) ? p : [...p, id]));
      const handleItem = (id) => () => { if (!autoRunning) place(id); };

      // 촤라라락: insert all blocks one-by-one with a stagger
      const addAll = () => {
        clearTimers();
        // sidebar order so footer lands before widgets get tucked in between
        const seq = [...LAYOUT_IDS, ...WIDGETS.map(w => w.id)].filter(id => !placed.includes(id));
        if (!seq.length) return;
        setAutoRunning(true);
        const STEP = 260;
        seq.forEach((id, i) => {
          const t = setTimeout(() => {
            place(id);
            if (i === seq.length - 1) {
              const done = setTimeout(() => setAutoRunning(false), 200);
              timersRef.current.push(done);
            }
          }, STEP * (i + 1));
          timersRef.current.push(t);
        });
      };

      const reset = () => { clearTimers(); setAutoRunning(false); setPlaced([]); };

      // cleanup on unmount
      useEffect(() => clearTimers, []);

      // keep the newest block in view as the page grows
      useEffect(() => {
        const el = bodyRef.current;
        if (el) el.scrollTop = el.scrollHeight;
      }, [placed.length]);

      const isEmpty = placed.length === 0;

      return (
        <div className="demo">
          {layoutDone && <Confetti key="conf" />}

          {/* head */}
          <div className="head">
            <div className="chips">
              <span className="chip-tag">알파캔버스</span>
              <span className="chip-tag beta">BETA</span>
            </div>
            <h2 className="title">클릭 한 번으로 내 브랜드 쇼핑몰 만들기</h2>
          </div>

          {/* body: sidebar + preview */}
          <div className="body">
            <div className="side">
              {/* 완성도 */}
              <div className={`prog ${everythingDone ? 'done' : ''}`}>
                <span className="prog-label">완성도 <span className="num">{everythingDone ? `전환율 ${conv.toFixed(1)}%` : `${progress}%`}</span></span>
                <span className="prog-bar"><span className="prog-fill" style={{ width: `${Math.max(progress, 0)}%` }}></span></span>
              </div>

              {/* 목록(스크롤 영역) */}
              <div className="side-scroll">
                {/* 레이아웃 블록 */}
                <div className="group">
                  <span className="group-label">레이아웃 블록</span>
                  {LAYOUT.map(b => (
                    <Item key={b.id} b={b} placed={placed.includes(b.id)} onClick={handleItem(b.id)} />
                  ))}
                </div>

                {/* 구매전환 위젯 */}
                <div className="group">
                  <span className="group-label">구매전환 위젯</span>
                  {WIDGETS.map(b => (
                    <Item key={b.id} b={b} placed={placed.includes(b.id)} onClick={handleItem(b.id)} />
                  ))}
                </div>
              </div>

              {/* CTA */}
              <div
                className={`cta ${isEmpty && !autoRunning ? 'idle' : ''} ${autoRunning ? 'busy' : ''} ${everythingDone && !autoRunning ? 'reset' : ''}`}
                onClick={autoRunning ? undefined : (everythingDone ? reset : addAll)}
              >
                <span className="cta-label">{autoRunning ? '추가하는 중…' : (everythingDone ? '다시 하기' : '블록과 위젯 추가하기')}</span>
                {isEmpty && !autoRunning && (
                  <>
                    <span className="cta-ring"></span>
                    <span className="cta-cursor">
                      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                        <path d="M5.5 3.2l13.4 7.7-5.7 1.1 3.3 6-2.6 1.4-3.3-6-3.8 4.2z" stroke="#fff" strokeWidth="1.2" strokeLinejoin="round" />
                      </svg>
                    </span>
                  </>
                )}
              </div>
            </div>

            {/* browser preview */}
            <div className="preview">
              <div className="browser-bar">
                <span className="dots"><i></i><i></i><i></i></span>
                <span className="url">maison.co.kr</span>
                <span className="brand-tag"><i></i>Maison</span>
              </div>
              <div className={`browser-body ${isEmpty ? 'is-empty' : ''}`} ref={bodyRef}>
                {isEmpty ? (
                  <div className="empty">
                    <span className="e-title">빈 페이지</span>
                    <span className="e-sub">블록을 탭해서 추가하세요</span>
                  </div>
                ) : (
                  renderTokens.map((tok, i) => (
                    tok === '__widgets__'
                      ? <div className="sec sf-wrow" key="wrow">{placedWidgets.map(wid => <WidgetCard key={wid} id={wid} />)}</div>
                      : <Section key={tok + i} id={tok} />
                  ))
                )}
              </div>
            </div>
          </div>
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
  </script>
</body>

</html>
