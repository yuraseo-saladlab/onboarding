<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>인스타피드 — 온보딩 인터랙션</title>

  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js"
    integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L"
    crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
    integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm"
    crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
    integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y"
    crossorigin="anonymous"></script>

  <style>
    :root {
      --font-sans: 'Pretendard Variable', 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-serif: 'Playfair Display', Georgia, 'Times New Roman', serif;

      /* design tokens */
      --magenta: #d300c5;
      --pink: #E13E88;
      --ig-grad: linear-gradient(90deg, #FFC700 0%, #FF6FB0 52%, #D300C5 100%);

      --bg-primary: #ffffff;
      --bg-tertiary: #f5f5f6;
      --border-default: #e3e4e7;
      --border-strong: #d6d7db;

      --text-primary: #2a2d38;
      --text-secondary: #5d6374;
      --text-placeholder: #8e929e;
      --ink: #1a1a1a;

      --r-sm: 4px;
      --r-lg: 8px;
      --r-3xl: 20px;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
    }

    body {
      font-family: var(--font-sans);
      background: var(--bg-primary);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      color: var(--ink);
    }

    #root {
      width: 100%;
      display: grid;
      place-items: center;
      position: relative;
    }

    /* ━━━━ DEMO CARD ━━━━ */
    .demo {
      width: 100%;
      max-width: 1200px;
      background: var(--bg-primary);
      border-radius: var(--r-3xl);
      padding: 24px;
      position: relative;
      overflow: hidden;
      box-shadow: 4px 16px 30px 0 rgba(0, 0, 0, 0.2);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* ── head ── */
    .head {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .chips {
      display: flex;
      gap: 8px;
      align-items: flex-start;
    }

    .chip-tag {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 24px;
      padding: 0 8px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: -0.01em;
      white-space: nowrap;
      background: var(--pink);
      color: #fff;
    }

    .chip-tag.beta {
      background: transparent;
      color: var(--pink);
      border: 1px solid rgba(225, 62, 136, 0.4);
    }

    .title {
      font-size: clamp(22px, 3.4vw, 40px);
      font-weight: 700;
      color: var(--ink);
      line-height: 1.3;
      letter-spacing: -0.02em;
    }

    /* ━━━━ OURIRA STOREFRONT ━━━━ */
    .stage {
      flex: 1 1 0;
      min-height: 0;
      display: flex;
    }

    .bz {
      flex: 1 1 0;
      min-width: 0;
      display: flex;
      flex-direction: column;
      background: #fff;
      border: 1px solid var(--border-strong);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.12);
    }

    /* chrome bar */
    .bz-chrome {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 14px;
      background: #f6f6f7;
      border-bottom: 1px solid var(--border-default);
    }

    .bz-chrome .dots {
      display: flex;
      gap: 6px;
    }

    .bz-chrome .dots i {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      display: block;
    }

    .bz-chrome .dots i:nth-child(1) { background: #ff5f57; }
    .bz-chrome .dots i:nth-child(2) { background: #febc2e; }
    .bz-chrome .dots i:nth-child(3) { background: #28c840; }

    .bz-chrome .url {
      flex: 1 1 0;
      min-width: 0;
      height: 22px;
      background: #fff;
      border: 1px solid var(--border-default);
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      font-size: 11px;
      color: var(--text-placeholder);
    }

    /* nav bar */
    .bz-nav {
      display: flex;
      align-items: center;
      gap: 22px;
      padding: 14px 24px;
      background: #fff;
      border-bottom: 1px solid var(--border-default);
    }

    .bz-logo {
      font-family: var(--font-serif);
      font-size: 22px;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.01em;
      margin-right: 6px;
    }

    .bz-nav .nav-link {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
      letter-spacing: -0.01em;
      white-space: nowrap;
    }

    .bz-nav .nav-right {
      margin-left: auto;
      display: flex;
      gap: 22px;
    }

    /* body */
    .bz-body {
      flex: 1 1 0;
      min-height: 0;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding: 20px 0 0;
      background: #fff;
    }

    .handle {
      text-align: center;
      font-size: 16px;
      font-weight: 600;
      color: var(--text-secondary);
      letter-spacing: -0.02em;
      margin-bottom: 16px;
      flex-shrink: 0;
    }

    /* feed grid */
    .feed {
      flex: 1 1 0;
      min-height: 0;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-auto-rows: 1fr;
      gap: 2px;
      background: var(--border-default);
    }

    .cell {
      position: relative;
      overflow: hidden;
      background: #ededf0;
    }

    /* idle placeholder */
    .cell::after {
      content: '';
      position: absolute;
      inset: 0;
      background:
        repeating-linear-gradient(45deg, rgba(0, 0, 0, 0.018) 0 10px, transparent 10px 20px);
      opacity: 1;
      transition: opacity 0.3s ease;
    }

    .cell .ph {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: #c7c8ce;
      transition: opacity 0.3s ease;
    }

    .cell img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      opacity: 0;
    }

    .cell.on::after { opacity: 0; }
    .cell.on .ph { opacity: 0; }

    .cell.on img {
      opacity: 1;
      animation: popImg 0.46s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }

    /* highlighted post */
    .cell.hl {
      z-index: 3;
      outline: 4px solid var(--magenta);
      outline-offset: -4px;
      box-shadow: 4px 16px 30px rgba(0, 0, 0, 0.2);
    }

    .cell.hl img {
      animation: popImg 0.46s cubic-bezier(0.34, 1.56, 0.64, 1) both, hlPulse 1.8s ease-in-out 0.5s infinite;
    }

    /* ── feed connect button ── */
    .feed-btn {
      position: absolute;
      left: 50%;
      top: 56%;
      transform: translate(-50%, -50%);
      z-index: 5;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 11px 20px;
      border-radius: 12px;
      background: var(--ig-grad);
      color: #fff;
      font-size: clamp(15px, 1.9vw, 22px);
      font-weight: 700;
      letter-spacing: -0.02em;
      white-space: nowrap;
      cursor: pointer;
      box-shadow: 4px 16px 22px rgba(0, 0, 0, 0.24);
      transition: transform 0.12s ease, box-shadow 0.2s ease, opacity 0.3s ease;
    }

    .feed-btn.idle {
      animation: btnPulse 2.2s ease-in-out infinite;
    }

    .feed-btn:hover {
      box-shadow: 6px 18px 26px rgba(211, 0, 197, 0.4);
    }

    .feed-btn:active {
      transform: translate(-50%, -50%) scale(0.97);
    }

    .feed-btn.busy {
      cursor: default;
      opacity: 0.95;
    }

    /* 데모 커서 (캔버스와 동일 스타일) */
    .feed-cursor {
      position: absolute;
      left: 50%;
      top: 56%;
      z-index: 6;
      width: 24px;
      height: 24px;
      margin-left: 34px;
      margin-top: 12px;
      pointer-events: none;
      color: #1a1a1a;
      filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.35));
      animation: cursorTap 2.2s ease-in-out infinite;
    }

    .feed-ring {
      position: absolute;
      left: 50%;
      top: 56%;
      z-index: 5;
      width: 16px;
      height: 16px;
      margin-left: 30px;
      margin-top: 16px;
      border-radius: 50%;
      pointer-events: none;
      background: rgba(255, 255, 255, 0.8);
      animation: ringPing 2.2s ease-out infinite;
    }

    /* result toast */
    .toast {
      position: absolute;
      left: 50%;
      bottom: 16px;
      transform: translateX(-50%);
      z-index: 5;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      border-radius: 9999px;
      background: rgba(26, 26, 26, 0.86);
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.01em;
      white-space: nowrap;
      backdrop-filter: blur(4px);
      animation: riseIn 0.4s ease both;
    }

    .toast b { color: #ff8fd0; }

    /* replay */
    .replay {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      z-index: 6;
      font-family: var(--font-sans);
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
      background: rgba(255, 255, 255, 0.96);
      border: 1px solid var(--border-strong);
      border-radius: 9999px;
      padding: 10px 22px;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.16);
      animation: popImg 0.4s ease both;
      transition: background 0.18s ease, transform 0.12s ease;
    }

    .replay:hover {
      background: #fff;
      transform: translate(-50%, -50%) scale(1.03);
    }

    .replay:active {
      transform: translate(-50%, -50%) scale(0.97);
    }

    /* ━━━━ CONFETTI ━━━━ */
    .conf-wrap {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      border-radius: inherit;
      z-index: 7;
    }

    .conf-piece {
      position: absolute;
      animation: confDrop linear forwards;
    }

    /* ━━━━ KEYFRAMES ━━━━ */
    @keyframes popImg {
      0% { opacity: 0; transform: scale(0.82); }
      65% { opacity: 1; transform: scale(1.04); }
      100% { opacity: 1; transform: scale(1); }
    }

    @keyframes hlPulse {
      0%, 100% { outline-color: var(--magenta); }
      50% { outline-color: #ff5fe6; }
    }

    @keyframes btnPulse {
      0%, 100% { transform: translate(-50%, -50%) scale(1); }
      50% { transform: translate(-50%, -50%) scale(1.04); }
    }

    @keyframes cursorTap {
      0%   { transform: translate(8px, 14px) scale(1); opacity: 0; }
      18%  { transform: translate(0, 0) scale(1); opacity: 1; }
      40%  { transform: translate(0, 0) scale(0.82); opacity: 1; }
      52%  { transform: translate(0, 0) scale(1); opacity: 1; }
      82%  { transform: translate(0, 0) scale(1); opacity: 1; }
      100% { transform: translate(8px, 14px) scale(1); opacity: 0; }
    }

    @keyframes ringPing {
      0%, 36% { transform: scale(0.3); opacity: 0; }
      44% { transform: scale(0.5); opacity: 0.85; }
      70% { transform: scale(2.6); opacity: 0; }
      100% { transform: scale(2.6); opacity: 0; }
    }

    @keyframes riseIn {
      from { opacity: 0; transform: translate(-50%, 8px); }
      to { opacity: 1; transform: translate(-50%, 0); }
    }

    @keyframes confDrop {
      0% { transform: translateY(-10px) rotate(0deg); opacity: 1; }
      100% { transform: translateY(720px) rotate(520deg); opacity: 0; }
    }

    /* narrow embeds */
    @media (max-width: 560px) {
      .bz-nav { gap: 12px; padding: 12px 14px; }
      .bz-nav .nav-right { gap: 12px; }
      .bz-logo { font-size: 18px; }
    }
  </style>
  <style id="embed-fill">
    html, body { background: #fff !important; }
    body { margin: 0 !important; padding: 0 !important; min-height: 100vh; display: flex !important; flex-direction: column !important; }
    #root { flex: 1 1 auto !important; display: flex !important; flex-direction: column !important; width: 100% !important; }
    .demo { flex: 1 1 auto !important; max-width: none !important; width: 100% !important; border-radius: 0 !important; box-shadow: none !important; }
  </style>
</head>

<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    /* feed photos (Figma order) + highlighted cell */
    const FEED = ['f2', 'f7', 'f1', 'f5', 'f8', 'f6', 'f4', 'f3'].map(n => `assets/insta/${n}.png`);
    const HL = 2; // 강조 셀(마젠타 테두리) — 가운데 코트 사진

    const InstaGlyph = () => (
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <rect x="3" y="3" width="18" height="18" rx="5.4" stroke="currentColor" strokeWidth="2" />
        <circle cx="12" cy="12" r="4" stroke="currentColor" strokeWidth="2" />
        <circle cx="17.4" cy="6.6" r="1.2" fill="currentColor" />
      </svg>
    );

    /* ── Confetti ── */
    const CONF_COLORS = ['#E1306C', '#feda75', '#fa7e1e', '#962fbf', '#4f5bd5', '#D300C5'];
    const Confetti = () => {
      const pieces = Array.from({ length: 28 }, (_, i) => ({
        id: i, left: 2 + (i * 37 % 96),
        color: CONF_COLORS[i % CONF_COLORS.length],
        delay: (i % 7) * 0.08, dur: 1.1 + (i % 5) * 0.22,
        w: 6 + (i % 4) * 2, h: 6 + (i % 3) * 2,
        round: i % 2 === 0,
      }));
      return (
        <div className="conf-wrap">
          {pieces.map(p => (
            <div key={p.id} className="conf-piece" style={{
              left: `${p.left}%`, top: -10, width: p.w, height: p.h,
              background: p.color, borderRadius: p.round ? '50%' : '2px',
              animationDelay: `${p.delay}s`, animationDuration: `${p.dur}s`,
            }} />
          ))}
        </div>
      );
    };

    /* ── Main Demo ── */
    const Demo = () => {
      const [filled, setFilled] = useState(0);   // 채워진 셀 수 0..8
      const [running, setRunning] = useState(false);
      const [done, setDone] = useState(false);
      const timers = useRef([]);

      const clearTimers = () => { timers.current.forEach(clearTimeout); timers.current = []; };
      useEffect(() => clearTimers, []);

      // 촤라라락: 피드 사진을 하나씩 끼워넣기
      const connect = () => {
        if (running || done) return;
        clearTimers();
        setRunning(true);
        const STEP = 230;
        for (let i = 1; i <= FEED.length; i++) {
          const t = setTimeout(() => {
            setFilled(i);
            if (i === FEED.length) {
              const d = setTimeout(() => { setRunning(false); setDone(true); }, 260);
              timers.current.push(d);
            }
          }, STEP * i);
          timers.current.push(t);
        }
      };

      const reset = () => { clearTimers(); setFilled(0); setRunning(false); setDone(false); };

      const idle = filled === 0 && !running;

      return (
        <div className="demo">
          {done && <Confetti key="conf" />}

          {/* head */}
          <div className="head">
            <div className="chips">
              <span className="chip-tag">알파인스타피드</span>
              <span className="chip-tag beta">BETA</span>
            </div>
            <h2 className="title">인스타 게시글이 상품 리뷰로 재탄생</h2>
          </div>

          {/* ourira storefront */}
          <div className="stage">
            <div className="bz">
              <div className="bz-chrome">
                <span className="dots"><i></i><i></i><i></i></span>
                <span className="url">🔒 ourira.co.kr</span>
              </div>
              <div className="bz-nav">
                <span className="bz-logo">ourira</span>
                <span className="nav-link">Shop</span>
                <span className="nav-link">Content</span>
                <span className="nav-link">Community</span>
                <span className="nav-right">
                  <span className="nav-link">My page</span>
                  <span className="nav-link">Cart</span>
                </span>
              </div>

              <div className="bz-body">
                <div className="handle">@ourira</div>

                <div className="feed">
                  {FEED.map((src, i) => {
                    const on = i < filled;
                    const hl = done && i === HL;
                    return (
                      <div key={i} className={`cell ${on ? 'on' : ''} ${hl ? 'hl' : ''}`}>
                        <span className="ph"><InstaGlyph /></span>
                        <img src={src} alt="" loading="lazy" />
                      </div>
                    );
                  })}
                </div>

                {/* connect button + cursor */}
                {!done && (
                  <>
                    <div
                      className={`feed-btn ${idle ? 'idle' : ''} ${running ? 'busy' : ''}`}
                      onClick={running ? undefined : connect}
                    >
                      <InstaGlyph />
                      {running ? '연동하는 중…' : '내 피드와 연동'}
                    </div>
                    {idle && (
                      <>
                        <span className="feed-ring"></span>
                        <span className="feed-cursor">
                          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                            <path d="M5.5 3.2l13.4 7.7-5.7 1.1 3.3 6-2.6 1.4-3.3-6-3.8 4.2z" stroke="#fff" strokeWidth="1.2" strokeLinejoin="round" />
                          </svg>
                        </span>
                      </>
                    )}
                  </>
                )}

                {/* result */}
                {done && (
                  <>
                    <div className="toast">인스타그램피드가 연동되었어요</div>
                    <span className="replay" onClick={reset}>다시 보기</span>
                  </>
                )}
              </div>
            </div>
          </div>
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
  </script>
</body>

</html>
