<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>알파캔버스 — AI 배너 데모</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
  <style>
    :root {
      --teal: #00B7A8;
      --teal-600: #0D9488;
      --ink: #1a1a1a;
      --dim: #5d6374;
      --faint: #8e929e;
      --line: #e3e4e7;
      --soft: #f5f5f6;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }

    body {
      font-family: 'Pretendard Variable', 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #fff;
      color: var(--ink);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    .wrap { flex: 1; display: flex; flex-direction: column; padding: 24px; gap: 16px; }
    .head { display: flex; flex-direction: column; gap: 8px; }
    .chips { display: flex; gap: 8px; }

    .tag {
      display: inline-flex; align-items: center; height: 24px; padding: 0 10px;
      border-radius: 9999px; font-size: 12px; font-weight: 700; color: #fff; background: var(--teal);
    }
    .tag.step { background: transparent; color: var(--teal-600); border: 1px solid #92F3E6; }

    .title { font-size: clamp(20px, 3vw, 28px); font-weight: 800; letter-spacing: -0.02em; line-height: 1.3; }
    .sub { font-size: 14px; color: var(--dim); line-height: 1.6; }

    /* 프롬프트 입력 */
    .prompt {
      display: flex; gap: 8px; align-items: center;
      border: 1px solid var(--line); border-radius: 12px; padding: 8px 8px 8px 14px; background: #fff;
    }
    .prompt input {
      flex: 1; border: none; outline: none; font-family: inherit; font-size: 14px; color: var(--ink);
    }
    .prompt input::placeholder { color: var(--faint); }
    .gen {
      border: none; cursor: pointer; font-family: inherit; font-size: 13px; font-weight: 700; color: #fff;
      padding: 10px 16px; border-radius: 9px; white-space: nowrap;
      background: linear-gradient(60deg, #00A597, #38C7BB);
    }
    .gen:disabled { opacity: .6; cursor: default; }

    .chip-row { display: flex; flex-wrap: wrap; gap: 7px; }
    .pchip {
      font-size: 12px; font-weight: 600; color: var(--teal-600); background: rgba(0, 183, 168, .08);
      border: 1px solid rgba(0, 183, 168, .2); border-radius: 9999px; padding: 6px 11px; cursor: pointer;
    }
    .pchip:hover { background: rgba(0, 183, 168, .14); }

    /* 결과 영역 */
    .stage {
      flex: 1; min-height: 220px; border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
      background: var(--soft); display: grid; place-items: center; position: relative;
    }

    .stage-empty { text-align: center; color: var(--faint); font-size: 14px; line-height: 1.6; padding: 24px; }

    /* AI가 만든 3가지 배너 시안 */
    .results { position: absolute; inset: 0; display: none; flex-direction: column; gap: 10px; padding: 12px; overflow: auto; }
    .results.on { display: flex; animation: fade .4s ease; }

    .bcard {
      position: relative; flex: 0 0 auto; min-height: 96px; border-radius: 12px; padding: 16px 18px; color: #fff;
      display: flex; flex-direction: column; justify-content: center; gap: 5px; cursor: pointer;
      transition: transform .15s ease, box-shadow .15s ease; animation: rise .45s cubic-bezier(.34, 1.56, .64, 1) both;
    }
    .bcard:hover { transform: translateY(-2px); box-shadow: 0 12px 26px rgba(0, 0, 0, .18); }
    .bcard .eyebrow { font-size: 9.5px; font-weight: 800; letter-spacing: .14em; opacity: .92; }
    .bcard h2 { font-size: 19px; font-weight: 800; letter-spacing: -0.01em; line-height: 1.2; }
    .bcard p { font-size: 12px; color: rgba(255, 255, 255, .9); }
    .bcard .b-cta { align-self: flex-start; margin-top: 4px; background: rgba(255, 255, 255, .88); color: #1a3a33; font-size: 11px; font-weight: 700; padding: 7px 13px; border-radius: 7px; }
    .bcard .badge { position: absolute; top: 10px; right: 12px; font-size: 9.5px; font-weight: 800; background: #beff74; color: #234d00; padding: 3px 9px; border-radius: 999px; }
    .bcard .pick { position: absolute; bottom: 12px; right: 12px; font-size: 10px; font-weight: 700; color: #fff; background: rgba(0, 0, 0, .28); padding: 4px 10px; border-radius: 999px; opacity: 0; transition: opacity .15s; }
    .bcard:hover .pick { opacity: 1; }

    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

    /* 생성 로딩 */
    .loader { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 12px; background: rgba(245, 245, 246, .8); }
    .loader.on { display: flex; }
    .spin { width: 34px; height: 34px; border-radius: 50%; border: 3px solid #d6e9e6; border-top-color: var(--teal); animation: spin .8s linear infinite; }
    .loader span { font-size: 13px; color: var(--dim); font-weight: 600; }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="head">
      <div class="chips"><span class="tag">알파캔버스</span><span class="tag step">STEP 3</span></div>
      <h1 class="title">AI 배너로 이미지 해결</h1>
      <p class="sub">문구만 입력하면 디자이너 없이도 어울리는 배너 이미지를 AI가 만들어줘요.</p>
    </div>

    <div class="prompt">
      <input id="pin" value="여름 신상 컬렉션, 청량한 분위기" placeholder="배너에 담을 내용을 입력하세요">
      <button class="gen" id="gen">✨ 배너 생성</button>
    </div>
    <div class="chip-row" id="chips"></div>

    <div class="stage">
      <div class="stage-empty" id="empty">‘배너 생성’을 누르면 AI가 배너 시안 3개를 만들어요</div>
      <div class="loader" id="loader"><span class="spin"></span><span>AI가 배너 3개를 만드는 중…</span></div>
      <div class="results" id="results"></div>
    </div>
  </div>

  <script>
    const PRESETS = ['여름 신상 컬렉션, 청량한 분위기', '단독 특가 세일, 강렬하게', '프리미엄 신제품, 고급스럽게'];
    // AI가 제안하는 3가지 스타일(무드)
    const STYLES = [
      { eyebrow: 'FRESH', g: 'linear-gradient(120deg,#0a3815,#00756b 60%,#00B7A8)', sub: '청량한 무드로 신상품을 강조했어요', cta: '지금 보러가기', badge: '추천' },
      { eyebrow: 'BOLD SALE', g: 'linear-gradient(120deg,#7a1f12,#e0451f 60%,#ff8a3d)', sub: '강렬한 색감으로 시선을 사로잡아요', cta: '특가 확인', badge: '' },
      { eyebrow: 'PREMIUM', g: 'linear-gradient(120deg,#14132b,#2b2940 55%,#4a4570)', sub: '고급스러운 분위기로 브랜드를 살렸어요', cta: '컬렉션 보기', badge: '' },
    ];
    const chips = document.getElementById('chips');
    const pin = document.getElementById('pin');
    const gen = document.getElementById('gen');
    const loader = document.getElementById('loader');
    const results = document.getElementById('results');
    const empty = document.getElementById('empty');

    PRESETS.forEach(p => {
      const c = document.createElement('span'); c.className = 'pchip'; c.textContent = p;
      c.onclick = () => { pin.value = p; };
      chips.appendChild(c);
    });

    let timer = null;
    gen.onclick = () => {
      clearTimeout(timer);
      empty.style.display = 'none';
      results.classList.remove('on');
      results.innerHTML = '';
      loader.classList.add('on');
      gen.disabled = true;
      const txt = pin.value.trim() || '신상 컬렉션';
      const title = txt.split(',')[0].trim();
      timer = setTimeout(() => {
        loader.classList.remove('on');
        results.innerHTML = STYLES.map((s, i) => `
          <div class="bcard" style="background:${s.g};animation-delay:${i * 90}ms">
            ${s.badge ? `<span class="badge">${s.badge}</span>` : ''}
            <span class="eyebrow">${s.eyebrow}</span>
            <h2>${title}</h2>
            <p>${s.sub}</p>
            <span class="b-cta">${s.cta}</span>
            <span class="pick">이 시안 사용</span>
          </div>`).join('');
        results.classList.add('on');
        gen.disabled = false;
      }, 1100);
    };
  </script>
</body>

</html>
