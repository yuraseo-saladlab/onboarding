<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>인스타피드 — 온보딩 인터랙션</title>

  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js"
    integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L"
    crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
    integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm"
    crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
    integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y"
    crossorigin="anonymous"></script>

  <style>
    :root {
      --font-sans: 'Pretendard Variable', 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;

      --canvas: #ffffff;
      --accent: #E1306C;
      --accent-bg: rgba(225, 48, 108, 0.06);
      --accent-bd: rgba(225, 48, 108, 0.42);
      --tile: #f4f3f1;
      --tile-bd: rgba(17, 17, 17, 0.06);
      --white: #ffffff;
      --ink: #1a1a1a;
      --ink-mid: rgba(26, 26, 26, 0.5);
      --ink-soft: rgba(26, 26, 26, 0.34);
      --ig-grad: linear-gradient(135deg, #feda75 0%, #fa7e1e 25%, #d62976 55%, #962fbf 80%, #4f5bd5 100%);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
    }

    body {
      font-family: var(--font-sans);
      background: var(--canvas);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px 20px;
    }

    body::before {
      content: '';
      position: fixed;
      width: 700px;
      height: 500px;
      border-radius: 50%;
      background: radial-gradient(ellipse at center, rgba(225, 48, 108, 0.06) 0%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    #root {
      width: 100%;
      display: grid;
      place-items: center;
      position: relative;
    }

    /* ━━━━ DEMO CARD ━━━━ */
    .demo {
      width: 100%;
      max-width: 600px;
      background: var(--white);
      border-radius: 28px;
      padding: 28px 24px 24px;
      position: relative;
      overflow: hidden;
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.05),
        0 14px 44px rgba(20, 20, 50, 0.13);
    }

    /* ━━━━ TOP ROW ━━━━ */
    .top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      gap: 12px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      color: var(--ink);
      background: #f4f3f1;
      border: 1px solid var(--tile-bd);
      padding: 5px 12px;
      border-radius: 9999px;
      letter-spacing: -0.01em;
      white-space: nowrap;
    }

    .badge::before {
      content: '';
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--accent);
      flex-shrink: 0;
    }

    .count-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      padding: 5px 12px;
      border-radius: 9999px;
      background: #f0f0f0;
      color: var(--ink-mid);
      white-space: nowrap;
      transition: background 0.3s ease, color 0.3s ease;
    }

    .count-pill.on {
      background: var(--accent);
      color: white;
    }

    .count-pill .num {
      font-family: var(--font-mono);
      font-weight: 700;
      font-size: 12.5px;
    }

    /* ━━━━ HEADLINE ━━━━ */
    .headline {
      font-size: 23px;
      font-weight: 700;
      color: var(--ink);
      line-height: 1.35;
      letter-spacing: -0.025em;
      margin-bottom: 18px;
    }

    /* ━━━━ INSTAGRAM PANEL ━━━━ */
    .ig-panel {
      background: var(--tile);
      border: 1.5px solid var(--tile-bd);
      border-radius: 16px;
      padding: 13px;
      transition: border-color 0.3s ease;
    }

    .ig-panel.idle {
      animation: idlePulse 2.6s ease-in-out infinite;
    }

    .ig-head {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 11px;
    }

    .ig-logo {
      width: 20px;
      height: 20px;
      border-radius: 6px;
      flex-shrink: 0;
      background: var(--ig-grad);
      display: grid;
      place-items: center;
    }

    .ig-title {
      font-size: 12.5px;
      font-weight: 700;
      color: var(--ink);
      letter-spacing: -0.01em;
    }

    .posts {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .post {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--white);
      border: 1.5px solid var(--tile-bd);
      border-radius: 12px;
      padding: 9px 12px;
      transition: border-color 0.3s ease, background 0.3s ease, transform 0.3s ease, opacity 0.3s ease;
    }

    .post.sel {
      border-color: var(--accent-bd);
      background: var(--accent-bg);
    }

    .post-thumb {
      width: 38px;
      height: 38px;
      border-radius: 8px;
      flex-shrink: 0;
      background-size: cover;
      background-position: center;
      position: relative;
    }

    .post-thumb::after {
      content: '';
      position: absolute;
      top: 3px;
      right: 3px;
      width: 10px;
      height: 10px;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.85);
      -webkit-mask: var(--ig-mask) center/contain no-repeat;
      mask: var(--ig-mask) center/contain no-repeat;
    }

    .post-body {
      flex: 1;
      min-width: 0;
    }

    .post-cap {
      font-size: 12px;
      font-weight: 500;
      color: var(--ink);
      letter-spacing: -0.01em;
      line-height: 1.3;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .post-meta {
      display: flex;
      gap: 10px;
      margin-top: 3px;
      font-size: 10.5px;
      font-weight: 500;
      color: var(--ink-soft);
    }

    .post-meta span {
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }

    .post-tag {
      flex-shrink: 0;
      font-size: 10px;
      font-weight: 700;
      color: var(--accent);
      background: var(--accent-bg);
      border: 1px solid var(--accent-bd);
      border-radius: 9999px;
      padding: 3px 8px;
      white-space: nowrap;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .post.sel .post-tag {
      opacity: 1;
    }

    /* ━━━━ ARROW (transform) ━━━━ */
    .morph {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin: 12px 0;
      font-size: 11.5px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: -0.01em;
      animation: riseIn 0.38s ease both;
    }

    .morph-ic {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--accent);
      display: grid;
      place-items: center;
      animation: bobDown 1.1s ease-in-out infinite;
    }

    /* ━━━━ SHOP REVIEW GRID ━━━━ */
    .shop {
      border: 1.5px solid var(--tile-bd);
      border-radius: 16px;
      overflow: hidden;
      animation: riseIn 0.42s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .shop-bar {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 9px 13px;
      background: var(--white);
      border-bottom: 1px solid var(--tile-bd);
    }

    .shop-bar .dots {
      display: flex;
      gap: 4px;
    }

    .shop-bar .dots i {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #dcdcd8;
      display: block;
    }

    .shop-bar .label {
      margin-left: 3px;
      font-size: 11px;
      font-weight: 700;
      color: var(--ink);
      letter-spacing: -0.01em;
    }

    .shop-bar .label-sub {
      margin-left: auto;
      font-size: 10px;
      font-weight: 600;
      color: var(--ink-soft);
    }

    .review-grid {
      padding: 10px;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 7px;
      background: #fbfbfa;
    }

    .rcard {
      border-radius: 9px;
      overflow: hidden;
      background: var(--white);
      border: 1px solid var(--tile-bd);
      animation: popCard 0.42s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }

    .rcard-img {
      aspect-ratio: 3 / 4;
      background-size: cover;
      background-position: center;
      position: relative;
    }

    .rcard-stars {
      position: absolute;
      bottom: 4px;
      left: 4px;
      display: flex;
      gap: 1px;
      background: rgba(0, 0, 0, 0.42);
      border-radius: 5px;
      padding: 2px 4px;
      backdrop-filter: blur(2px);
    }

    .rcard-foot {
      padding: 5px 6px 6px;
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .rcard-foot .nm {
      font-size: 8.5px;
      font-weight: 600;
      color: var(--ink-mid);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ━━━━ STAT ━━━━ */
    .stat {
      margin-top: 14px;
      background: var(--accent-bg);
      border: 1.5px solid var(--accent-bd);
      border-radius: 16px;
      padding: 15px 16px;
      animation: riseIn 0.42s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .stat-row {
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 9px;
    }

    .stat-from {
      font-size: 14px;
      font-weight: 600;
      color: var(--ink-soft);
      font-family: var(--font-mono);
    }

    .stat-arrow {
      color: var(--accent);
      font-weight: 700;
      font-size: 15px;
    }

    .stat-to {
      font-size: 28px;
      font-weight: 800;
      color: var(--accent);
      font-family: var(--font-mono);
      letter-spacing: -0.02em;
      line-height: 1;
    }

    .stat-cap {
      text-align: center;
      font-size: 11px;
      font-weight: 600;
      color: var(--ink-mid);
      margin-top: 8px;
      letter-spacing: -0.01em;
    }

    /* ━━━━ STATUS ━━━━ */
    .status {
      text-align: center;
      min-height: 40px;
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .s-line {
      font-size: 13.5px;
      font-weight: 500;
      color: var(--ink);
      animation: riseIn 0.38s ease both;
    }

    .s-line .em {
      color: var(--accent);
      font-weight: 700;
    }

    .hint {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      width: 100%;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: white;
      background: linear-gradient(110deg,
          color-mix(in srgb, var(--accent), black 10%) 0%,
          var(--accent) 50%,
          color-mix(in srgb, var(--accent), white 22%) 100%);
      border-radius: 14px;
      padding: 14px 18px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      box-shadow: 0 4px 18px color-mix(in srgb, var(--accent), transparent 44%);
    }

    .hint::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 60%;
      height: 100%;
      background: linear-gradient(105deg, transparent 0%, rgba(255, 255, 255, 0.52) 50%, transparent 100%);
      animation: shimmerSweep 2s ease-in-out infinite;
      pointer-events: none;
    }

    .replay-btn {
      margin-top: 2px;
      font-family: var(--font-sans);
      font-size: 12px;
      font-weight: 500;
      color: var(--ink-mid);
      background: none;
      border: 1px solid rgba(0, 0, 0, 0.12);
      border-radius: 9999px;
      padding: 6px 14px;
      cursor: pointer;
      animation: riseIn 0.38s 0.16s ease both;
      transition: color 0.18s ease, background 0.18s ease;
    }

    .replay-btn:hover {
      color: var(--ink);
      background: rgba(0, 0, 0, 0.04);
    }

    /* ━━━━ CONFETTI ━━━━ */
    .conf-wrap {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      border-radius: inherit;
    }

    .conf-piece {
      position: absolute;
      animation: confDrop linear forwards;
    }

    /* ━━━━ KEYFRAMES ━━━━ */
    @keyframes idlePulse {

      0%,
      100% {
        box-shadow: 0 0 0 0px rgba(225, 48, 108, 0);
      }

      50% {
        box-shadow: 0 0 0 5px rgba(225, 48, 108, 0.12);
      }
    }

    @keyframes riseIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes popCard {
      0% {
        opacity: 0;
        transform: scale(0.85);
      }

      65% {
        opacity: 1;
        transform: scale(1.04);
      }

      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes popBadge {
      0% {
        transform: scale(0) rotate(-12deg);
        opacity: 0;
      }

      65% {
        transform: scale(1.2) rotate(3deg);
        opacity: 1;
      }

      100% {
        transform: scale(1) rotate(0);
        opacity: 1;
      }
    }

    @keyframes bobDown {

      0%,
      100% {
        transform: translateY(-2px);
      }

      50% {
        transform: translateY(2px);
      }
    }

    @keyframes shimmerSweep {
      0% {
        transform: translateX(-180%);
      }

      100% {
        transform: translateX(350%);
      }
    }

    @keyframes confDrop {
      0% {
        transform: translateY(-10px) rotate(0deg);
        opacity: 1;
      }

      100% {
        transform: translateY(640px) rotate(520deg);
        opacity: 0;
      }
    }
  </style>

<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    /* ── Icons ── */
    const HeartIcon = () => (
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M12 20s-7-4.6-9.3-9.1C1 7.6 2.8 4.5 6 4.5c2 0 3.2 1.2 4 2.3.8-1.1 2-2.3 4-2.3 3.2 0 5 3.1 3.3 6.4C19 15.4 12 20 12 20z" stroke="currentColor" strokeWidth="1.8" strokeLinejoin="round" />
      </svg>
    );
    const CommentIcon = () => (
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M21 11.5a8.5 8.5 0 0 1-12.3 7.6L3 21l1.9-5.7A8.5 8.5 0 1 1 21 11.5z" stroke="currentColor" strokeWidth="1.8" strokeLinejoin="round" />
      </svg>
    );
    const StarIcon = ({ s = 8 }) => (
      <svg width={s} height={s} viewBox="0 0 24 24" fill="#fff" aria-hidden="true">
        <path d="M12 2.5l2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 17.8 6.2 20.9l1.1-6.5L2.6 9.3l6.5-.9L12 2.5z" />
      </svg>
    );
    const SyncIcon = () => (
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M4 12a8 8 0 0 1 13.7-5.6L20 8M20 4v4h-4" stroke="white" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />
        <path d="M20 12a8 8 0 0 1-13.7 5.6L4 16m0 4v-4h4" stroke="white" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />
      </svg>
    );

    /* ── Gradient placeholder photos (different hue per item) ── */
    const grad = (a, b) => `linear-gradient(140deg, ${a}, ${b})`;
    const POSTS = [
      { cap: '데일리룩 추천템, 완전 인생 가디건 🤍', likes: '5.3천', cmt: '125', img: grad('#d9c3b0', '#a98e76') },
      { cap: '오늘의 데일리 메이크업 ✨', likes: '3.2천', cmt: '88', img: grad('#e6c7c2', '#bd8d8a') },
      { cap: '봄 신상 코트 컬러 비교 추천', likes: '2.6천', cmt: '41', img: grad('#c5cfc4', '#93a892') },
    ];

    /* ── Confetti ── */
    const CONF_COLORS = ['#E1306C', '#feda75', '#fa7e1e', '#962fbf', '#4f5bd5', '#222222'];
    const Confetti = () => {
      const pieces = useMemo(() =>
        Array.from({ length: 30 }, (_, i) => ({
          id: i, left: 2 + Math.random() * 96,
          color: CONF_COLORS[i % CONF_COLORS.length],
          delay: Math.random() * 0.6, dur: 1.1 + Math.random() * 1.0,
          w: 5 + Math.random() * 7, h: 5 + Math.random() * 7,
          round: Math.random() > 0.45,
        })), []
      );
      return (
        <div className="conf-wrap">
          {pieces.map(p => (
            <div key={p.id} className="conf-piece" style={{
              left: `${p.left}%`, top: -10, width: p.w, height: p.h,
              background: p.color, borderRadius: p.round ? '50%' : '2px',
              animationDelay: `${p.delay}s`, animationDuration: `${p.dur}s`,
            }} />
          ))}
        </div>
      );
    };

    /* ── Main Demo ── */
    const Demo = () => {
      const [phase, setPhase] = useState(0);   // 0 idle · 1 syncing · 2 reborn reviews · 3 stat
      const ids = useRef([]);

      const later = (fn, d) => ids.current.push(setTimeout(fn, d));
      const stop = () => { ids.current.forEach(clearTimeout); ids.current = []; };
      useEffect(() => stop, []);

      const connect = (e) => {
        if (e) e.stopPropagation();
        if (phase !== 0) return;
        setPhase(1);                       // posts get selected/연동중
        later(() => setPhase(2), 1500);    // reborn as shop reviews
        later(() => setPhase(3), 3200);    // stat
      };
      const reset = (e) => { e.stopPropagation(); stop(); setPhase(0); };

      return (
        <div className={`demo ${phase === 3 ? 'done' : ''}`} data-screen-label={`phase-${phase}`}>
          {phase === 3 && <Confetti key="conf" />}

          {/* top row */}
          <div className="top-row">
            <div className="badge">알파인스타피드</div>
            <div className={`count-pill ${phase >= 2 ? 'on' : ''}`}>
              <span>쇼핑몰 리뷰</span>
              <span className="num">{phase >= 2 ? '+3' : '0'}</span>
            </div>
          </div>

          {/* headline */}
          <h2 className="headline">
            인스타 게시글이<br />
            상품 리뷰로 재탄생하는 순간
          </h2>

          {/* instagram tagged posts (phase 0–1) */}
          {phase <= 1 && (
            <div className={`ig-panel ${phase === 0 ? 'idle' : ''}`}>
              <div className="ig-head">
                <span className="ig-logo">
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <rect x="3" y="3" width="18" height="18" rx="5.4" stroke="white" strokeWidth="2" />
                    <circle cx="12" cy="12" r="4" stroke="white" strokeWidth="2" />
                    <circle cx="17.4" cy="6.6" r="1.2" fill="white" />
                  </svg>
                </span>
                <span className="ig-title"># 내가 태그된 게시글</span>
              </div>
              <div className="posts">
                {POSTS.map((p, i) => (
                  <div key={i} className={`post ${phase === 1 ? 'sel' : ''}`}>
                    <div className="post-thumb" style={{ background: p.img }}></div>
                    <div className="post-body">
                      <div className="post-cap">{p.cap}</div>
                      <div className="post-meta">
                        <span><HeartIcon /> {p.likes}</span>
                        <span><CommentIcon /> {p.cmt}</span>
                      </div>
                    </div>
                    <span className="post-tag">연동됨</span>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* morph indicator (phase 1) */}
          {phase === 1 && (
            <div className="morph">
              <span className="morph-ic"><SyncIcon /></span>
              게시글을 상품 리뷰로 연동하는 중…
            </div>
          )}

          {/* reborn shop reviews (phase 2–3) */}
          {phase >= 2 && (
            <div className="shop">
              <div className="shop-bar">
                <span className="dots"><i></i><i></i><i></i></span>
                <span className="label">내 쇼핑몰 · REVIEW</span>
                <span className="label-sub">인스타 후기</span>
              </div>
              <div className="review-grid">
                {POSTS.map((p, i) => (
                  <div key={i} className="rcard" style={{ animationDelay: `${i * 0.1}s` }}>
                    <div className="rcard-img" style={{ background: p.img }}>
                      <div className="rcard-stars">
                        {[0, 1, 2, 3, 4].map(s => <StarIcon key={s} s={7} />)}
                      </div>
                    </div>
                    <div className="rcard-foot">
                      <span className="nm">@ourira_official</span>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* stat (phase 3) */}
          {phase >= 3 && (
            <div className="stat">
              <div className="stat-row">
                <span className="stat-from">인스타 후기</span>
                <span className="stat-arrow">→</span>
                <span className="stat-to">쇼핑몰 매출</span>
              </div>
              <p className="stat-cap">방치되던 인스타 콘텐츠가 구매를 만드는 리뷰로 🎉</p>
            </div>
          )}

          {/* status */}
          <div className="status">
            {phase === 0 && <p className="hint" onClick={connect}>상품 연동하고 리뷰 만들기</p>}
            {phase === 1 && <p className="s-line">태그된 게시글 3개 연동 중…</p>}
            {phase === 2 && <p className="s-line">인스타 후기가 <span className="em">상품 리뷰</span>로 떴어요</p>}
            {phase === 3 && (
              <>
                <p className="s-line">인스타 콘텐츠와 후기를 매출로</p>
                <button className="replay-btn" onClick={reset}>다시 보기</button>
              </>
            )}
          </div>
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
  </script>
</body>

</html>
