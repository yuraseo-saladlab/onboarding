<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>인스타피드 v2 — 게시글이 리뷰로, 그리고 피드로</title>

  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js"
    integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L"
    crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
    integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm"
    crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
    integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y"
    crossorigin="anonymous"></script>

  <style>
    :root {
      --font-sans: 'Pretendard Variable', 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-serif: 'Playfair Display', Georgia, serif;

      --magenta: #d300c5;
      --pink: #E13E88;
      --ig-grad: linear-gradient(90deg, #FFC700 0%, #FF6FB0 52%, #D300C5 100%);
      --pink-grad: linear-gradient(90deg, #ff8fc3 0%, #E13E88 52%, #D300C5 100%);

      --bg-primary: #ffffff;
      --bg-tertiary: #f5f5f6;
      --border-default: #e3e4e7;
      --border-strong: #d6d7db;

      --text-primary: #2a2d38;
      --text-secondary: #5d6374;
      --text-placeholder: #8e929e;
      --ink: #1a1a1a;

      --r-sm: 4px;
      --r-lg: 8px;
      --r-3xl: 20px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }

    body {
      font-family: var(--font-sans);
      background: var(--bg-primary);
      min-height: 100vh;
      display: grid; place-items: center;
      padding: 20px; color: var(--ink);
    }

    #root { width: 100%; display: grid; place-items: center; position: relative; }

    /* ━━━━ DEMO CARD ━━━━ */
    .demo {
      width: 100%; max-width: 1200px;
      background: var(--bg-primary);
      border-radius: var(--r-3xl);
      padding: 24px;
      position: relative; overflow: hidden;
      box-shadow: 4px 16px 30px 0 rgba(0, 0, 0, 0.2);
      display: flex; flex-direction: column; gap: 16px;
    }

    /* head */
    .head { display: flex; flex-direction: column; gap: 8px; }
    .chips { display: flex; gap: 8px; align-items: center; }

    .chip-tag {
      display: inline-flex; align-items: center; justify-content: center;
      height: 24px; padding: 0 8px; border-radius: 9999px;
      font-size: 12px; font-weight: 500; letter-spacing: -0.01em; white-space: nowrap;
      background: var(--pink); color: #fff;
    }

    .title { font-size: clamp(22px, 3.2vw, 36px); font-weight: 700; color: var(--ink); line-height: 1.3; letter-spacing: -0.02em; }

    .counter {
      display: inline-flex; align-items: center; gap: 6px;
      align-self: flex-start; margin-top: 2px;
      padding: 5px 12px; border-radius: 9999px;
      background: var(--bg-tertiary); color: var(--text-secondary);
      font-size: 13px; font-weight: 600; letter-spacing: -0.01em;
      transition: background 0.3s ease, color 0.3s ease;
    }
    .counter.on { background: var(--pink); color: #fff; }
    .counter .num { font-variant-numeric: tabular-nums; }

    /* ━━━━ STAGE ━━━━ */
    .stage {
      flex: 1 1 0; min-height: 0;
      position: relative;
      display: flex; gap: 24px;
      align-items: stretch; justify-content: center;
      background: var(--bg-tertiary);
      border: 1px solid var(--border-default);
      border-radius: 16px;
      padding: 24px;
    }

    .screen { display: contents; }
    .fade-in { animation: fadeIn 0.5s ease both; }

    /* ── sidebar (tagged posts) ── */
    .sidebar {
      flex: 1 1 0; min-width: 0; max-width: 380px;
      display: flex; flex-direction: column; gap: 14px; min-height: 0;
    }
    .sb-head { display: flex; align-items: center; gap: 9px; flex-shrink: 0; }
    .sb-ic { width: 26px; height: 26px; flex-shrink: 0; border-radius: 7px; background: var(--ig-grad); color: #fff; display: grid; place-items: center; }
    .sb-title { font-size: 15px; font-weight: 700; color: var(--text-primary); letter-spacing: -0.01em; }

    .posts { flex: 1 1 0; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-right: 2px; }
    .posts::-webkit-scrollbar { width: 5px; }
    .posts::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.12); border-radius: 9999px; }

    .post {
      display: flex; align-items: center; gap: 12px;
      background: #fff; border: 1px solid var(--border-default);
      border-radius: 12px; padding: 12px;
      transition: border-color 0.3s ease, background 0.3s ease, opacity 0.3s ease;
    }
    .post.linked { border-color: rgba(225, 62, 136, 0.4); background: rgba(225, 62, 136, 0.05); }

    .post-thumb { width: 50px; height: 50px; flex-shrink: 0; border-radius: 8px; object-fit: cover; background: #ededf0; }
    .post-body { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 5px; }
    .post-cap { font-size: 14px; font-weight: 500; color: var(--text-primary); letter-spacing: -0.01em; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .post-meta { display: flex; gap: 12px; font-size: 12px; font-weight: 500; color: var(--text-placeholder); }
    .post-meta span { display: inline-flex; align-items: center; gap: 4px; }

    .post-tag {
      flex-shrink: 0; font-size: 11px; font-weight: 700; color: var(--pink);
      background: rgba(225, 62, 136, 0.1); border-radius: 9999px; padding: 4px 9px; white-space: nowrap;
      opacity: 0; transform: scale(0.6);
      transition: opacity 0.3s ease, transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
    }
    .post.linked .post-tag { opacity: 1; transform: scale(1); }

    /* ── phone (shop review) ── */
    .phone { flex-shrink: 0; width: 300px; background: #1c1c22; border-radius: 30px; padding: 10px; box-shadow: 0 20px 44px rgba(0,0,0,0.28); display: flex; flex-direction: column; }
    .phone-screen { flex: 1 1 0; min-height: 0; background: #fff; border-radius: 22px; overflow: hidden; display: flex; flex-direction: column; }
    .ph-bar { display: flex; align-items: center; justify-content: center; padding: 12px; border-bottom: 1px solid var(--border-default); flex-shrink: 0; }
    .ph-bar .rv { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 700; color: var(--text-primary); letter-spacing: 0.04em; }
    .ph-bar .rv .star { color: #ff8a00; display: grid; }
    .ph-prod { display: flex; align-items: center; gap: 10px; padding: 12px; border-bottom: 1px solid var(--border-default); flex-shrink: 0; }
    .ph-prod img { width: 46px; height: 46px; border-radius: 8px; object-fit: cover; background: #ededf0; }
    .ph-prod-info { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
    .ph-prod-name { font-size: 12px; font-weight: 600; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ph-prod-rate { font-size: 11px; font-weight: 600; color: var(--text-secondary); display: inline-flex; align-items: center; gap: 4px; }
    .ph-prod-rate .star { color: #ff8a00; }
    .ph-grid { flex: 1 1 0; min-height: 0; overflow-y: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 3px; padding: 3px; background: #fff; }
    .ph-grid::-webkit-scrollbar { width: 0; }
    .rcell { position: relative; aspect-ratio: 1; overflow: hidden; background: #f0f0f2; }
    .rcell .ph-ico { position: absolute; inset: 0; display: grid; place-items: center; color: #cdced4; transition: opacity 0.3s ease; }
    .rcell img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; }
    .rcell.on .ph-ico { opacity: 0; }
    .rcell.on img { opacity: 1; animation: popImg 0.46s cubic-bezier(0.34,1.56,0.64,1) both; }
    .rcell .stars { position: absolute; left: 5px; bottom: 5px; display: flex; gap: 1px; background: rgba(0,0,0,0.42); border-radius: 5px; padding: 2px 4px; backdrop-filter: blur(2px); opacity: 0; transition: opacity 0.3s ease 0.2s; }
    .rcell.on .stars { opacity: 1; }

    /* ━━━━ FINISH SCREEN: ourira storefront feed ━━━━ */
    .bz { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; background: #fff; border: 1px solid var(--border-strong); border-radius: 8px; overflow: hidden; box-shadow: 0 12px 30px rgba(0,0,0,0.12); }
    .bz-chrome { display: flex; align-items: center; gap: 8px; padding: 9px 14px; background: #f6f6f7; border-bottom: 1px solid var(--border-default); }
    .bz-chrome .dots { display: flex; gap: 6px; }
    .bz-chrome .dots i { width: 11px; height: 11px; border-radius: 50%; display: block; }
    .bz-chrome .dots i:nth-child(1) { background: #ff5f57; }
    .bz-chrome .dots i:nth-child(2) { background: #febc2e; }
    .bz-chrome .dots i:nth-child(3) { background: #28c840; }
    .bz-chrome .url { flex: 1 1 0; min-width: 0; height: 22px; background: #fff; border: 1px solid var(--border-default); border-radius: 7px; display: flex; align-items: center; justify-content: center; gap: 5px; font-size: 11px; color: var(--text-placeholder); }
    .bz-nav { display: flex; align-items: center; gap: 22px; padding: 14px 24px; background: #fff; border-bottom: 1px solid var(--border-default); }
    .bz-logo { font-family: var(--font-serif); font-size: 22px; font-weight: 700; color: var(--text-primary); margin-right: 6px; }
    .bz-nav .nav-link { font-size: 13px; font-weight: 500; color: var(--text-secondary); white-space: nowrap; }
    .bz-nav .nav-right { margin-left: auto; display: flex; gap: 22px; }
    .bz-body { flex: 1 1 0; min-height: 0; position: relative; overflow: hidden; display: flex; flex-direction: column; padding: 20px 0 0; background: #fff; }
    .handle { text-align: center; font-size: 16px; font-weight: 600; color: var(--text-secondary); letter-spacing: -0.02em; margin-bottom: 16px; flex-shrink: 0; }
    .feed { flex: 1 1 0; min-height: 0; display: grid; grid-template-columns: repeat(4, 1fr); grid-auto-rows: 1fr; gap: 2px; background: var(--border-default); }
    .cell { position: relative; overflow: hidden; background: #ededf0; }
    .cell img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; animation: popImg 0.46s cubic-bezier(0.34,1.56,0.64,1) both; }
    .cell.hl { z-index: 3; outline: 4px solid var(--magenta); outline-offset: -4px; box-shadow: 4px 16px 30px rgba(0,0,0,0.2); }
    .cell.hl img { animation: popImg 0.46s cubic-bezier(0.34,1.56,0.64,1) both, hlPulse 1.8s ease-in-out 0.6s infinite; }

    .toast {
      position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 5;
      display: flex; align-items: center; gap: 8px;
      padding: 10px 16px; border-radius: 9999px;
      background: rgba(26,26,26,0.86); color: #fff;
      font-size: 14px; font-weight: 600; letter-spacing: -0.01em; white-space: nowrap;
      backdrop-filter: blur(4px); animation: toastIn 0.4s ease both;
    }

    /* ━━━━ BUTTON (v1 style: centered IG pill) ━━━━ */
    .btn {
      position: absolute; left: 50%; top: 52%; transform: translate(-50%, -50%);
      z-index: 6;
      display: inline-flex; align-items: center; gap: 8px;
      padding: 13px 22px; border-radius: 12px;
      background: var(--ig-grad); color: #fff;
      font-size: clamp(15px, 1.9vw, 20px); font-weight: 700; letter-spacing: -0.02em; white-space: nowrap;
      cursor: pointer;
      box-shadow: 4px 16px 22px rgba(0,0,0,0.24);
      transition: box-shadow 0.2s ease;
    }
    .btn.idle { animation: btnPulse 2.2s ease-in-out infinite; }
    .btn:hover { box-shadow: 6px 18px 26px rgba(211, 0, 197, 0.4); }
    .btn:active { transform: translate(-50%, -50%) scale(0.97); }
    .btn.busy { cursor: default; opacity: 0.95; }

    .btn.reset {
      background: rgba(255,255,255,0.96); color: var(--text-primary);
      border: 1px solid var(--border-strong); box-shadow: 0 6px 18px rgba(0,0,0,0.16);
    }
    .btn.reset:hover { background: #fff; }

    /* 데모 커서 */
    .btn-cursor {
      position: absolute; left: 50%; top: 52%; z-index: 7;
      width: 24px; height: 24px; margin-left: 40px; margin-top: 14px;
      pointer-events: none; color: #1a1a1a;
      filter: drop-shadow(0 2px 3px rgba(0,0,0,0.35));
      animation: cursorTap 2.2s ease-in-out infinite;
    }
    .btn-ring {
      position: absolute; left: 50%; top: 52%; z-index: 6;
      width: 16px; height: 16px; margin-left: 36px; margin-top: 18px;
      border-radius: 50%; pointer-events: none;
      background: rgba(255,255,255,0.8);
      animation: ringPing 2.2s ease-out infinite;
    }

    /* ━━━━ CONFETTI ━━━━ */
    .conf-wrap { position: absolute; inset: 0; pointer-events: none; overflow: hidden; border-radius: inherit; z-index: 9; }
    .conf-piece { position: absolute; animation: confDrop linear forwards; }

    /* ━━━━ KEYFRAMES ━━━━ */
    @keyframes popImg { 0% { opacity: 0; transform: scale(0.82); } 65% { opacity: 1; transform: scale(1.05); } 100% { opacity: 1; transform: scale(1); } }
    @keyframes hlPulse { 0%, 100% { outline-color: var(--magenta); } 50% { outline-color: #ff5fe6; } }
    @keyframes fadeIn { from { opacity: 0; transform: scale(0.985); } to { opacity: 1; transform: scale(1); } }
    @keyframes toastIn { from { opacity: 0; transform: translate(-50%, 8px); } to { opacity: 1; transform: translate(-50%, 0); } }
    @keyframes btnPulse { 0%, 100% { transform: translate(-50%, -50%) scale(1); } 50% { transform: translate(-50%, -50%) scale(1.04); } }
    @keyframes cursorTap {
      0% { transform: translate(8px, 14px) scale(1); opacity: 0; }
      18% { transform: translate(0, 0) scale(1); opacity: 1; }
      40% { transform: translate(0, 0) scale(0.82); opacity: 1; }
      52% { transform: translate(0, 0) scale(1); opacity: 1; }
      82% { transform: translate(0, 0) scale(1); opacity: 1; }
      100% { transform: translate(8px, 14px) scale(1); opacity: 0; }
    }
    @keyframes ringPing { 0%, 36% { transform: scale(0.3); opacity: 0; } 44% { transform: scale(0.5); opacity: 0.85; } 70% { transform: scale(2.6); opacity: 0; } 100% { transform: scale(2.6); opacity: 0; } }
    @keyframes confDrop { 0% { transform: translateY(-10px) rotate(0deg); opacity: 1; } 100% { transform: translateY(720px) rotate(520deg); opacity: 0; } }

    @media (max-width: 620px) {
      .stage { flex-direction: column; align-items: center; }
      .sidebar { max-width: none; width: 100%; }
      .phone { width: 260px; }
      .bz-nav { gap: 12px; padding: 12px 14px; }
      .bz-nav .nav-right { gap: 12px; }
    }
  </style>
  <style id="embed-fill">
    html, body { background: #fff !important; }
    body { margin: 0 !important; padding: 0 !important; min-height: 100vh; display: flex !important; flex-direction: column !important; }
    #root { flex: 1 1 auto !important; display: flex !important; flex-direction: column !important; width: 100% !important; }
    .demo { flex: 1 1 auto !important; max-width: none !important; width: 100% !important; border-radius: 0 !important; box-shadow: none !important; }
  </style>
</head>

<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    /* tagged posts → reviews (6), then storefront feed (8) */
    const POSTS = [
      { img: 'f1', cap: '#ourira 데일리 코디 추천 🤍', likes: '5.3천', cmt: '125' },
      { img: 'f2', cap: '#ourira 린넨 셋업 후기', likes: '3.2천', cmt: '88' },
      { img: 'f3', cap: '#ourira 스트라이프 팬츠 데일리', likes: '2.6천', cmt: '41' },
      { img: 'f4', cap: '#ourira 가을 무드 자켓 ✨', likes: '4.1천', cmt: '96' },
      { img: 'f5', cap: '#ourira 니트 컬러 비교', likes: '1.9천', cmt: '33' },
      { img: 'f6', cap: '#ourira 데님 코디 추천템', likes: '2.2천', cmt: '57' },
      { img: 'f7', cap: '#ourira 트렌치 코트 데일리', likes: '3.7천', cmt: '72' },
      { img: 'f8', cap: '#ourira 오피스 캐주얼 룩', likes: '2.9천', cmt: '64' },
    ].map(p => ({ ...p, src: `assets/insta/${p.img}.png` }));

    const FEED = ['f2', 'f7', 'f1', 'f5', 'f8', 'f6', 'f4', 'f3'].map(n => `assets/insta/${n}.png`);
    const HL = 2; // 강조 셀

    const InstaGlyph = ({ s = 16 }) => (
      <svg width={s} height={s} viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <rect x="3" y="3" width="18" height="18" rx="5.4" stroke="currentColor" strokeWidth="2" />
        <circle cx="12" cy="12" r="4" stroke="currentColor" strokeWidth="2" />
        <circle cx="17.4" cy="6.6" r="1.2" fill="currentColor" />
      </svg>
    );
    const HeartIcon = () => (<svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M12 20s-7-4.6-9.3-9.1C1 7.6 2.8 4.5 6 4.5c2 0 3.2 1.2 4 2.3.8-1.1 2-2.3 4-2.3 3.2 0 5 3.1 3.3 6.4C19 15.4 12 20 12 20z" stroke="currentColor" strokeWidth="1.8" strokeLinejoin="round" /></svg>);
    const CommentIcon = () => (<svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M21 11.5a8.5 8.5 0 0 1-12.3 7.6L3 21l1.9-5.7A8.5 8.5 0 1 1 21 11.5z" stroke="currentColor" strokeWidth="1.8" strokeLinejoin="round" /></svg>);
    const Star = ({ s = 8, c = '#fff' }) => (<svg width={s} height={s} viewBox="0 0 24 24" fill={c}><path d="M12 2.5l2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 17.8 6.2 20.9l1.1-6.5L2.6 9.3l6.5-.9L12 2.5z" /></svg>);

    const CONF_COLORS = ['#E1306C', '#feda75', '#fa7e1e', '#962fbf', '#4f5bd5', '#D300C5'];
    const Confetti = () => {
      const pieces = Array.from({ length: 28 }, (_, i) => ({
        id: i, left: 2 + (i * 37 % 96), color: CONF_COLORS[i % CONF_COLORS.length],
        delay: (i % 7) * 0.08, dur: 1.1 + (i % 5) * 0.22, w: 6 + (i % 4) * 2, h: 6 + (i % 3) * 2, round: i % 2 === 0,
      }));
      return (
        <div className="conf-wrap">
          {pieces.map(p => (
            <div key={p.id} className="conf-piece" style={{ left: `${p.left}%`, top: -10, width: p.w, height: p.h, background: p.color, borderRadius: p.round ? '50%' : '2px', animationDelay: `${p.delay}s`, animationDuration: `${p.dur}s` }} />
          ))}
        </div>
      );
    };

    /* ── Main ── */
    const Demo = () => {
      // phase: 0 idle · 1 linking(리뷰 전환) · 2 feed(마무리: 쇼핑몰 피드)
      const [phase, setPhase] = useState(0);
      const [linked, setLinked] = useState(0);   // 폰 리뷰 채움 0..6
      const timers = useRef([]);
      const gridRef = useRef(null);

      const clearTimers = () => { timers.current.forEach(clearTimeout); timers.current = []; };
      useEffect(() => clearTimers, []);

      const connect = () => {
        if (phase !== 0) return;
        clearTimers();
        setPhase(1);
        const STEP = 300;
        for (let i = 1; i <= POSTS.length; i++) {
          const t = setTimeout(() => {
            setLinked(i);
            if (gridRef.current) gridRef.current.scrollTop = gridRef.current.scrollHeight;
          }, STEP * i);
          timers.current.push(t);
        }
        // 리뷰 전환 끝 → 쇼핑몰 피드로 마무리
        const fin = setTimeout(() => setPhase(2), STEP * POSTS.length + 700);
        timers.current.push(fin);
      };

      const reset = () => { clearTimers(); setLinked(0); setPhase(0); };

      const idle = phase === 0;
      const linking = phase === 1;
      const finish = phase === 2;

      return (
        <div className="demo">
          {finish && <Confetti key="conf" />}

          {/* head */}
          <div className="head">
            <div className="chips"><span className="chip-tag">알파인스타피드</span></div>
            <h2 className="title">인스타 게시글이 상품 리뷰로 재탄생</h2>
            <span className={`counter ${finish ? 'on' : ''}`}>
              쇼핑몰 리뷰 <span className="num">{linked}개</span>
            </span>
          </div>

          {/* stage */}
          <div className="stage">
            {!finish ? (
              /* ── Screen A: tagged posts + phone review ── */
              <div className="screen">
                <div className="sidebar">
                  <div className="sb-head">
                    <span className="sb-ic"><InstaGlyph s={15} /></span>
                    <span className="sb-title"># 내가 태그된 게시글</span>
                  </div>
                  <div className="posts">
                    {POSTS.map((p, i) => (
                      <div key={i} className={`post ${i < linked ? 'linked' : ''}`}>
                        <img className="post-thumb" src={p.src} alt="" />
                        <div className="post-body">
                          <span className="post-cap">{p.cap}</span>
                          <span className="post-meta"><span><HeartIcon /> {p.likes}</span><span><CommentIcon /> {p.cmt}</span></span>
                        </div>
                        <span className="post-tag">리뷰 전환</span>
                      </div>
                    ))}
                  </div>
                </div>

                <div className="phone">
                  <div className="phone-screen">
                    <div className="ph-bar"><span className="rv"><span className="star"><Star s={14} c="#ff8a00" /></span>REVIEW</span></div>
                    <div className="ph-prod">
                      <img src="assets/insta/f1.png" alt="" />
                      <div className="ph-prod-info">
                        <span className="ph-prod-name">오버핏 트위드 자켓</span>
                        <span className="ph-prod-rate"><span className="star"><Star s={11} c="#ff8a00" /></span>4.9 · 리뷰 {linked}개</span>
                      </div>
                    </div>
                    <div className="ph-grid" ref={gridRef}>
                      {POSTS.map((p, i) => (
                        <div key={i} className={`rcell ${i < linked ? 'on' : ''}`}>
                          <span className="ph-ico"><InstaGlyph s={20} /></span>
                          <img src={p.src} alt="" />
                          <span className="stars">{[0,1,2,3,4].map(s => <Star key={s} s={7} />)}</span>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              </div>
            ) : (
              /* ── Screen B (마무리): ourira storefront feed ── */
              <div className="bz fade-in">
                <div className="bz-chrome">
                  <span className="dots"><i></i><i></i><i></i></span>
                  <span className="url">🔒 ourira.co.kr</span>
                </div>
                <div className="bz-nav">
                  <span className="bz-logo">ourira</span>
                  <span className="nav-link">Shop</span>
                  <span className="nav-link">Content</span>
                  <span className="nav-link">Community</span>
                  <span className="nav-right"><span className="nav-link">My page</span><span className="nav-link">Cart</span></span>
                </div>
                <div className="bz-body">
                  <div className="handle">@ourira</div>
                  <div className="feed">
                    {FEED.map((src, i) => (
                      <div key={i} className={`cell ${i === HL ? 'hl' : ''}`}>
                        <img src={src} alt="" style={{ animationDelay: `${i * 0.06}s` }} />
                      </div>
                    ))}
                  </div>
                  <div className="toast">인스타그램피드가 연동되었어요</div>
                </div>
              </div>
            )}

            {/* button (v1 style, centered) */}
            {!linking && (
              <>
                <div
                  className={`btn ${idle ? 'idle' : ''} ${finish ? 'reset' : ''}`}
                  onClick={finish ? reset : connect}
                >
                  {!finish && <InstaGlyph s={18} />}
                  {finish ? '다시 보기' : '상품 연동하고 리뷰 만들기'}
                </div>
                {idle && (
                  <>
                    <span className="btn-ring"></span>
                    <span className="btn-cursor">
                      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M5.5 3.2l13.4 7.7-5.7 1.1 3.3 6-2.6 1.4-3.3-6-3.8 4.2z" stroke="#fff" strokeWidth="1.2" strokeLinejoin="round" /></svg>
                    </span>
                  </>
                )}
              </>
            )}
            {linking && (
              <div className="btn busy">리뷰로 전환하는 중…</div>
            )}
          </div>
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
  </script>
</body>

</html>
