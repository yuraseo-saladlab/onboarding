<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>알파캔버스 3번 씬 — 알파앱스</title>
  <link rel="stylesheet" as="style" crossorigin
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="core.css">
</head>

<body>
  <!-- 임베드 스테이지 -->
  <div id="embedRoot"><div class="dt-stage" id="embedStage"></div></div>

  <!-- ══ 이 씬의 애니메이션 HTML — 여기만 수정하면 됨 ══ -->
  <div id="sceneDefs" hidden aria-hidden="true">
    <template data-scene="cv3">
            <div class="sc cv-benefit">
        <div class="cvb-head">스킨 하나 구매하면, 시작에 필요한 3가지</div>
        <div class="cvb-head2"><b>30만원 상당</b>의 혜택을 바로 받아요</div>
        <div class="cvb-list">
          <div class="cvb-card b1">
            <div class="cvb-cover"><img class="cc-ic" src="assets/gift1.png" alt=""><span class="cc-n">혜택 1</span></div>
            <div class="cvb-top"><img class="cvb-blogo" src="assets/logo-alphaapps.png" alt="AlphaApps"><span class="cvb-stamp"><i class="cvb-stamp-ck"></i></span></div>
            <div class="cvb-t">알파앱스 2개월 무료</div>
            <div class="cvb-d">필수 앱 <b>리뷰·업셀·푸시</b>를 <b>2개월 무료</b>로 써보세요.</div>
          </div>
          <div class="cvb-card b2">
            <div class="cvb-cover"><img class="cc-ic" src="assets/gift2.png" alt=""><span class="cc-n">혜택 2</span></div>
            <div class="cvb-top"><img class="cvb-blogo" src="assets/logo-tosspay.png" alt="tosspay"><span class="cvb-stamp"><i class="cvb-stamp-ck"></i></span></div>
            <div class="cvb-t">토스페이 도입 혜택</div>
            <div class="cvb-d"><b>도입 비용 0원</b>, 결제 <b>수수료까지 인하</b>해 드려요.</div>
          </div>
          <div class="cvb-card b3">
            <div class="cvb-cover"><img class="cc-ic" src="assets/gift3.png" alt=""><span class="cc-n">혜택 3</span></div>
            <div class="cvb-top"><img class="cvb-blogo" src="assets/logo-saveoffice.png" alt="saveoffice"><span class="cvb-stamp"><i class="cvb-stamp-ck"></i></span></div>
            <div class="cvb-t">비상주사무실 최대 30% 할인</div>
            <div class="cvb-d">사업자 등록 전에도 쓰는 사업장 주소, <b>최대 30% 할인</b>.</div>
          </div>
        </div>
        <div class="crm-cta cvb-cta"><button class="cl-start" data-act type="button"><span class="cl-lb">도입 혜택 받기</span></button><span class="cl-cursor"></span><button class="cmp-replay" type="button">↺ 다시 보기</button></div>
      </div>
    </template>
  </div>

  <script src="core.js"></script>
  <script>
    document.body.classList.add('embed-mode');
    renderEmbed('cv3', new URLSearchParams(location.search).get('autoplay') !== '0');
  </script>
</body>

</html>
